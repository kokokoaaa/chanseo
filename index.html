<html lang="ko">
<head>
<meta charset="utf-8">

<title>찬서 : 찬붕이의 뱀서</title>

<style>
:root{
  --felt:#0e3a2c; --felt-deep:#072219; --brass:#d6a94a; --chip-red:#c8323a;
  --ivory:#f1e7cf; --ink:#04120c; --muted:#a9c2b2; --prism:#c56ce0;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --felt:#0b3024; --felt-deep:#051a13; } }

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--felt-deep);color:var(--ivory);font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 14px;pointer-events:none;font-family:'Do Hyeon',system-ui,sans-serif;font-size:17px;text-shadow:0 1px 2px #000}
.bar{position:relative;width:150px;height:18px;background:rgba(0,0,0,.5);border:1px solid rgba(214,169,74,.7);border-radius:3px;overflow:hidden}

.bar span{position:relative;display:block;text-align:center;font-size:14px;line-height:17px}
.gold{color:var(--brass)}
#botLeft{position:absolute;left:10px;bottom:14px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 120px);pointer-events:none;z-index:6}
/* 레벨업·상점·스탯 창이 열려 멈춰 있어도 증강 아이콘을 볼 수 있게 위에 띄우고, 창 내용은 아이콘 줄에 가리지 않게 아래 여백 */
#ov>.panel,#st>.panel{margin-bottom:125px}
#augBar{display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto}

.aico{width:38px;height:40px;border-radius:7px;border:2px solid var(--ac);background:rgba(4,18,12,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Do Hyeon',sans-serif;cursor:help;box-shadow:0 0 6px color-mix(in srgb,var(--ac) 45%,transparent);user-select:none;-webkit-user-select:none}
.aico i{font-style:normal;font-size:17px;line-height:1}

.mtile.poor{opacity:.5;cursor:help}
#cosPrev{position:fixed;z-index:260;display:none;padding:6px;background:#0b1f18;border:1px solid var(--brass);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.6);pointer-events:none}
#cosPrev canvas{display:block;width:260px;height:160px;image-rendering:pixelated;border-radius:6px}
#augTip{position:fixed;z-index:250;display:none;max-width:260px;background:rgba(4,18,12,.96);border:1px solid var(--ac,#d6a94a);border-radius:8px;padding:8px 10px;font-family:'Do Hyeon',sans-serif;font-size:14px;color:#f1e7cf;pointer-events:none;line-height:1.35}
#augTip b{display:block;font-size:16px;font-weight:400;color:var(--ac,#d6a94a)}
#augTip small{display:block;color:var(--muted);font-size:12px;margin:2px 0 4px}
@media (max-width:520px){.aico{width:32px;height:34px}.aico i{font-size:14px}.aico span{font-size:9px;max-width:29px}}
#syn{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;font-family:'Do Hyeon',sans-serif;font-size:15px}
.pill{padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(241,231,207,.25);color:var(--muted)}
.pill[data-tg]{cursor:help}
.hx-hf_gold{color:#ffd76a;text-shadow:0 0 8px rgba(255,215,106,.8)}
.hx-hf_fire{background:linear-gradient(90deg,#ff3d1f,#ffb347,#ffe27a,#ff3d1f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hfm 1.6s linear infinite;filter:drop-shadow(0 0 6px rgba(255,120,40,.7))}
.hx-hf_rainbow{background:linear-gradient(90deg,#ff5ad8,#ffd76a,#7be08f,#5fc9d9,#b552d6,#ff5ad8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hfm 2.4s linear infinite}

@keyframes hfm{to{background-position:200% 0}}
.hc-hf_neon{box-shadow:0 0 0 2px #5fc9d9,0 0 16px rgba(95,201,217,.8)!important}

#augTip .tl.on{color:#f1e7cf}

.pill.on2{border-color:var(--brass);color:var(--brass)}

@media (max-width:520px){#autoBar{flex-direction:column;align-items:flex-end;top:54px}#autoBar button{padding:3px 7px;font-size:12px}#autoBar #speedBtn{font-size:14px}#buffs{top:186px}}
.shophead{position:sticky;top:-22px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--felt);margin:-22px -20px 6px;padding:16px 20px 10px;border-bottom:1px solid rgba(214,169,74,.3);border-radius:16px 16px 0 0}

.clsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.cdet{margin-top:10px;padding:14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(214,169,74,.45)}

.cbars{display:grid;grid-template-columns:auto 1fr 3.2em;gap:6px 10px;align-items:center;font-size:13px;margin-bottom:12px}

.cbars i u{display:block;height:100%;background:var(--brass);border-radius:4px}
.cbars span:nth-child(3n){text-align:right;font-family:'Do Hyeon',sans-serif;font-size:15px}
.cmeta{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;line-height:1.5}
.cmeta>span:nth-child(odd){color:var(--muted);white-space:nowrap}
.cmeta .tg2{display:inline-block;padding:1px 8px;margin:0 4px 3px 0;border-radius:999px;border:1px solid #ff9ad0;color:#ff9ad0;font-size:12px}
@media (max-width:640px){.clsgrid{gap:5px}.clscard canvas{width:64px;height:64px}.clscard b{font-size:17px}.clscard .role{font-size:11px}}
.rank{display:flex;flex-direction:column;gap:3px}
.rrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:7px;background:rgba(0,0,0,.22);font-size:15px}
.rrow.me{background:rgba(214,169,74,.22);outline:1px solid var(--brass)}
.rrow .rn{font-family:'Do Hyeon',sans-serif;font-size:17px;text-align:center}
.rrow .rnm{min-width:0}
.rrow .rnm b{display:block;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rnm i{display:block;font-style:normal;font-size:13px;color:#e8d9b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rc{color:var(--muted);font-size:12.5px;text-align:right;line-height:1.35}
.rrow .rt{font-family:'Do Hyeon',sans-serif;color:var(--brass);font-size:18px;text-align:right}
.hof{margin:4px 0 16px;padding:14px 12px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(214,169,74,.2),rgba(0,0,0,.2));border:1px solid var(--brass)}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pcard{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 8px;border-radius:10px;background:rgba(4,18,12,.55);border:1px solid rgba(214,169,74,.45);min-width:0}

.pcard.p1 .pn{font-size:22px;color:var(--brass)}
.pcard .pc{font-size:12px;color:var(--muted)}
.pcard .ps{font-family:'Do Hyeon',sans-serif;font-size:22px;color:var(--brass)}.pcard.p1 .ps{font-size:27px}
.pcard .pq{margin-top:4px;font-size:13px;line-height:1.4;color:var(--ivory);background:rgba(241,231,207,.1);border-radius:8px;padding:6px 8px;width:100%;word-break:break-all}

.hof .rank{margin-top:10px}
.hof .more{display:block;width:100%;margin-top:8px;font-size:15px;padding:7px}
@media (max-width:520px){.podium{grid-template-columns:1fr 1fr;gap:6px}.pcard.p1{order:0;grid-column:1/-1}.pcard.p2,.pcard.p3{order:1;padding:8px 6px}.pcard .pn{font-size:17px}.pcard .ps{font-size:19px}.pcard .pq{font-size:12px}}
.mbal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:rgba(214,169,74,.14);border:1px solid var(--brass);border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-size:15px}
.mbal b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:26px;color:var(--brass)}
.mbal small{color:var(--muted);font-size:12.5px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid rgba(214,169,74,.55);background:rgba(0,0,0,.28);color:var(--ivory);font:inherit;cursor:pointer;transition:transform .1s,background .1s}

.mtile b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:17px}
.mtile .md{font-size:12px;color:var(--muted);line-height:1.35}
.mtile .mnow{font-size:12px;color:#9fe8b0}

.pips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}

.card{position:relative}
@keyframes cPop{0%{transform:scale(.55) rotate(-5deg);opacity:0}60%{transform:scale(1.1) rotate(1deg);opacity:1}100%{transform:scale(1)}}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
@keyframes eGlow{from{box-shadow:0 0 0 2px #b26bff,0 0 14px 2px rgba(160,90,255,.55)}to{box-shadow:0 0 0 3px #e2c4ff,0 0 30px 8px rgba(170,100,255,.85)}}

.card.rar-e{animation:cPop .55s cubic-bezier(.2,1.4,.4,1) both,eGlow 1s ease-in-out .55s infinite alternate}

.card.rar-e::after,.card.rar-l::after{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.8) 48%,transparent 64%);background-size:260% 100%;animation:shine 1.8s ease-in-out .4s infinite}

// 장별 추가 난이도. 3장부터 일반 몹 체력·피해·스폰량, 정예 확률이 더 오름 (보스 체력은 제외)
// 4장(마지막)은 수를 줄이고 개체를 크게 강화: 체력 ×3.5, 피해 ×1.25, 크기 ×1.2, 정예 +30%p. 대신 경험치·골드도 많이 줌
const CHAP_MUL=[{hp:1,dm:1,sp:1,n:22,el:0,xp:1,sz:1},{hp:1,dm:1,sp:1,n:22,el:0,xp:1.2,sz:1},{hp:1.5,dm:1.3,sp:.85,n:26,el:.06,xp:1.4,sz:1},{hp:3.5,dm:1.25,sp:1.1,n:12,el:.3,xp:2.2,sz:1.2,cap:110}];

// 높은 난이도의 몹 체력 배율은 시작 때 45%만 적용되고 4분(effT 240)에 걸쳐 100%까지 올라감. 초반에 한 마리 잡는 데 너무 오래 걸리지 않게
const dfHp=()=>{const h=dfM().hp;return h<=1?h:1+(h-1)*Math.min(1,.45+.55*effT()/240);};
function spawnAt(type,x,y,noElite,forceElite){
  const T=ET[type],d=S.round,cm=chapM();
  const elite=!T.boss&&!T.flee&&(forceElite||(!noElite&&effT()>120&&Math.random()<Math.min(.35+cm.el+dfM().el,(effT()-120)/700+cm.el+dfM().el)));
  const om=Math.pow(1.3,Math.max(0,effT()-600)/60);
  const m=(T.boss?1+.12*(Math.min(d,50)-1):(1+.35*(d-1))*om)*(elite?4:1)*(T.boss?dfM().bhp:cm.hp*dfHp()),dm=(T.boss?1+.08*(d-1):(1+.15*(d-1))*om)*(elite?1.5:1)*cm.dm*dfM().dm;
  S.en.push({type,x,y,elite,r:T.r*(elite?1.45:1)*(T.boss?1:cm.sz),hp:T.hp*m,maxHp:T.hp*m,dmg:T.dmg*dm,spd:T.spd*Math.min(1.75,1+.025*(d-1))*(1+.07*Math.max(0,effT()-600)/60),cd:rand(.3,1.2),hcd:1,bcd:2.5,hit:0,rot:Math.random()*6,orbCd:0,pt:0,ps:0,pTick:0,alive:true,boss:!!T.boss});
  const e=S.en[S.en.length-1];if(elite&&effT()>150){const ks=Object.keys(AFFIX);e.aff=ks[Math.floor(Math.random()*ks.length)];if(AFFIX[e.aff].on)AFFIX[e.aff].on(e);}
  return e;
}
function ringPos(extra=40){const p=S.p,a=(p.moving&&Math.random()<.6)?Math.atan2(p.lmy,p.lmx)+rand(-1.1,1.1):Math.random()*TAU,r=Math.hypot(W,H)/2+extra;return [clamp(p.x+Math.cos(a)*r,20,WW-20),clamp(p.y+Math.sin(a)*r,20,WH-20)];}
function spawnBurst(){
  if(S.en.length>(S.bossI>=0?(dfM().bc||35):(chapM().cap||190)))return;
  let n=Math.min(chapM().n,2+Math.floor(S.round*.7));if(S.bossI>=0)n=Math.ceil(n*.35);
  const side=Math.floor(Math.random()*4);
  const [cx,cy]=ringPos();
  for(let i=0;i<n;i++)spawnAt(pickType(),cx+rand(-40,40),cy+rand(-40,40));
}

function farPos(r){const a=Math.random()*TAU,p=S.p;return [clamp(p.x+Math.cos(a)*r,80,WW-80),clamp(p.y+Math.sin(a)*r,80,WH-80)];}
function startEvent(){
  const ks=Object.keys(EVENTS).filter(k=>k!==S.lastEv);const k=ks[Math.floor(Math.random()*ks.length)];S.lastEv=k;
  const E=EVENTS[k],ev={k,t:0,T:{horde:15,hunt:30,goblin:18,shrine:25,moon:25}[k]};S.ev=ev;
  if(k==='horde'){const pool=['grunt','runner','slime','boar','ghost','bomber'].filter(t=>t!=='boar'||S.round>=2.5);ev.type=pool[Math.floor(Math.random()*pool.length)];}
  if(k==='hunt'){for(let i=0;i<3;i++){const [x,y]=ringPos(60);const t=['grunt','tank','boar','ranger'][Math.floor(Math.random()*4)];const e=spawnAt(t,x,y,false,true);e.hunt=true;}}
  if(k==='goblin'){const [x,y]=farPos(260);const e=spawnAt('goblin',x,y,true);e.gold=true;}
  if(k==='shrine'){const [x,y]=farPos(380);ev.x=x;ev.y=y;ev.r=70;ev.ch=0;pushOut(ev,ev.r*.5);}
  S.evBanner={s:`${E.icon} ${E.n}`,d:E.d,col:E.col,t:2.6};

function endEvent(win){
  const ev=S.ev;if(!ev)return;S.ev=null;S.evT=rand(50,70);
  if(ev.k==='horde'&&win){const g=price(45);S.gold+=g;toast(`대군을 버텼다. ${g} 골드`);}
  if(ev.k==='hunt'){for(const e of S.en)e.hunt=false;if(win){S.pendingLv++;S.boost=true;toast('정예 사냥 성공! 고급 스탯 카드');}else toast('정예 사냥 실패');}
  if(ev.k==='goblin'&&!win){for(const e of S.en)if(e.type==='goblin'){e.alive=false;burst(e.x,e.y,'#e8bb4f',14);}toast('보물 고블린이 도망쳤다');}
  if(ev.k==='shrine'&&!win)toast('제단이 사라졌다');

function updEvent(dt){
  if(S.bossI>=0||S.win)return;
  if(S.evBanner){S.evBanner.t-=dt;if(S.evBanner.t<=0)S.evBanner=null;}
  if(S.bless&&S.bless.t>0){S.bless.t-=dt;if(S.bless.k==='guard'&&S.p.alive)S.p.hp=Math.min(S.p.maxHp,S.p.hp+S.p.maxHp*.02*dt);}
  if(!S.ev){S.evT=(S.evT??50)-dt;if(S.evT<=0)startEvent();return;}
  const ev=S.ev,p=S.p;ev.t+=dt;
  if(ev.k==='hunt'&&!S.en.some(e=>e.alive&&e.hunt)){endEvent(true);return;}
  if(ev.k==='goblin'&&!S.en.some(e=>e.alive&&e.type==='goblin')){endEvent(true);return;}
  if(ev.k==='shrine'&&p.alive){if(d2(ev,p)<ev.r*ev.r){ev.ch+=dt;if(ev.ch>=2.5){const B=BLESS[Math.floor(Math.random()*BLESS.length)];S.bless={k:B.k,n:B.n,t:30};S.flash=.25;S.rings.push({x:ev.x,y:ev.y,r:10,max:220,life:.5,col:'#9fd3ff'});toast(`${B.n}: ${B.d} (30초)`);endEvent(true);return;}}else ev.ch=Math.max(0,ev.ch-dt*.5);}
  if(ev.t>=ev.T)endEvent(ev.k==='horde'||ev.k==='moon');
}

// 한 장 2분 30초, 총 10분. 난이도·경제는 '환산 시간'(실제 ×1.2)으로 계산해서 예전 12분 구성과 장별 난이도가 같음
const CH_LEN=150,CHAPTERS=4;
const BOSSES=[
  {type:'boss',ch:'1장',t:'숲의 문지기'},
  {type:'boss2',ch:'2장',t:'저주의 인도자'},
  {type:'boss3',ch:'3장',t:'늪의 군주'},
  {type:'boss4',ch:'마지막 장',t:'카지노의 주인'}

// 2·3장 보스는 성장한 화력에 몇 초 만에 녹아서 체력 보정
const BOSS_HPM=[1,1.8,2.2,1];
function spawnBoss(i){
  if(S.ev)endEvent(false);S.evBanner=null;
  // 기존 몹은 유지하되 너무 많으면 가까운 40마리(정예 포함)만 남김. 보스 등장 시 체력 30% 회복
  const kN=(dfM().bc||35)+5;if(S.en.length>kN){const p0=S.p,keep=new Set([...S.en].sort((a,b)=>(b.elite-a.elite)||(d2(a,p0)-d2(b,p0))).slice(0,kN));S.en=S.en.filter(e=>keep.has(e));}
  S.p.hp=Math.min(S.p.maxHp,S.p.hp+S.p.maxHp*.3);
  S.bossI=i;S.tele=[];S.hz=[];S.bStart=S.bt||0;
  const a=Math.random()*TAU;spawnAt(BOSSES[i].type,clamp(S.p.x+Math.cos(a)*300,60,WW-60),clamp(S.p.y+Math.sin(a)*300,60,WH-60));
  const b=S.en[S.en.length-1];b.dmg*=BOSS_DM[i]||1;b.maxHp*=BOSS_HPM[i]||1;b.hp=b.maxHp;b.bk=0;go(b,'intro');S.boss=b;
  // 보스 결계: 전체 맵의 약 1/4 넓이(3000×3000) 사각 구역. 분노(체력 50%) 시 85%로, 광폭화마다 5%씩 좁아짐. r = 한 변의 절반
  {const tr=1500,cx=clamp(S.p.x,tr,WW-tr),cy=clamp(S.p.y,tr,WH-tr);S.arena={x:cx,y:cy,r:tr*1.3,tr};
   const d=Math.hypot(b.x-cx,b.y-cy);if(d>tr*.7){b.x=cx+(b.x-cx)/d*tr*.7;b.y=cy+(b.y-cy)/d*tr*.7;}}
  S.shake=.5;S.bannerT=3.2;

function bossDown(e){

  else{S.bonusAug++;S.shopPend=true;S.keys=(S.keys||0)+1;toast('보스 격파! 🔑 열쇠 획득. 보상 후 상점이 열립니다');}

// 일반 몹 탄환 상한 (렉 방지). 상한에 걸리면 그 몹은 이번엔 안 쏨. 보스 탄은 제외
const EB_CAP=80;
function eShot(x,y,a,spd,dmg,r=6,col,life=4){S.pr.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,mine:false,dmg,life,r,bc:col});}
function eRing(e,n,spd,dmg,off=0,r=6,col){for(let i=0;i<n;i++)eShot(e.x,e.y,off+i*TAU/n,spd,dmg,r,col);}
function eFan(e,n,spread,spd,dmg,r=6,col){const a=Math.atan2(S.p.y-e.y,S.p.x-e.x);for(let i=0;i<n;i++)eShot(e.x,e.y,a+(n>1?(i/(n-1)-.5)*spread:0),spd,dmg,r,col);}
function stepTo(e,tx,ty,spd,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1,s=Math.min(d,spd*dt);e.x+=dx/d*s;e.y+=dy/d*s;return d;}
function keepDist(e,o,dt,lo,hi){const {p,d,sp}=o;if(d<lo)stepTo(e,e.x*2-p.x,e.y*2-p.y,sp,dt);else if(d>hi)stepTo(e,p.x,p.y,sp,dt);else{const a=Math.atan2(e.y-p.y,e.x-p.x)+(e.dir||1)*.9*dt*sp/Math.max(d,1);e.x=p.x+Math.cos(a)*d;e.y=p.y+Math.sin(a)*d;}}
const nearP=r=>{const p=S.p,a=Math.random()*TAU,k=Math.random()*r;return [clamp(p.x+Math.cos(a)*k,30,WW-30),clamp(p.y+Math.sin(a)*k,30,WH-30)];};
// 광폭화: 기준 시간을 넘기면 30초마다 단계 상승 (최대 5단계). 단계당 공격력 +10%, 이동 속도 +5%, 결계 −5%

const COS_TIER={tr_gold:1,tr_ice:2,tr_fire:3,tr_rainbow:4,kl_coin:1,kl_card:2,kl_void:3,kl_prism:4,au_gold:1,au_jade:2,au_blood:3,au_crown:4,sk_shadow:1,sk_ice:2,sk_gold:3,sk_ghost:4};

// 모양 있는 파티클 그리기 (sh: coin/card/star/ember/shard, s: 크기)
function drawPart(c,q){const a=Math.min(1,q.life*2.2),s=q.s||4;c.globalAlpha=a;c.fillStyle=q.col;
  if(!q.sh){c.fillRect(q.x-s/2,q.y-s/2,s,s);return;}
  c.save();c.translate(q.x,q.y);c.rotate(q.rot||0);
  if(q.sh==='coin'){c.beginPath();c.ellipse(0,0,s,s*Math.abs(Math.cos((q.rot||0)*2))+1,0,0,TAU);c.fill();c.fillStyle='#fff3c4';c.fillRect(-1,-1,2,2);}
  else if(q.sh==='card'){c.fillRect(-s*.6,-s,s*1.2,s*2);c.fillStyle=q.c2||'#c8323a';c.fillRect(-1.5,-1.5,3,3);}
  else if(q.sh==='star'){c.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.35:s,an=i*Math.PI/4;c.lineTo(Math.cos(an)*r,Math.sin(an)*r);}c.closePath();c.fill();}
  else if(q.sh==='ember'){c.globalAlpha=a*.35;c.beginPath();c.arc(0,0,s*1.8,0,TAU);c.fill();c.globalAlpha=a;c.beginPath();c.arc(0,0,s*.8,0,TAU);c.fill();}
  else if(q.sh==='shard'){c.beginPath();c.moveTo(0,-s*1.4);c.lineTo(s*.7,s);c.lineTo(-s*.7,s);c.closePath();c.fill();}
  c.restore();}
function stepPart(q,dt){q.x+=q.vx*dt;q.y+=q.vy*dt;const d=Math.pow(q.dr??.9,dt*60);q.vx*=d;q.vy*=d;if(q.g)q.vy+=q.g*dt;if(q.vr)q.rot=(q.rot||0)+q.vr*dt;q.life-=dt;}

  if(t===2&&Math.random()<.2)emit({x:x+(Math.random()-.5)*30,y:y-14+(Math.random()-.5)*36,vx:0,vy:-20,dr:.95,life:.6,col:'#dff6ff',sh:'star',s:4,vr:3});
  if(t===4&&Math.random()<.3)emit({x:x+(Math.random()-.5)*26,y:y-6,vx:(Math.random()-.5)*20,vy:-60,dr:.97,life:.8,col:Math.random()<.5?'#bfe8ff':'#ffffff',sh:'ember',s:3});}
function skinPost(c,x,y,it,T){const t=COS_TIER[it.k]||1;if(t===3){const ph=(T%2.2)/2.2;if(ph<.3){c.save();c.globalAlpha=.7*(1-ph/.3);c.strokeStyle='#ffffff';c.lineWidth=3;const sx=x-18+ph/.3*36;c.beginPath();c.moveTo(sx-6,y-34);c.lineTo(sx+6,y+4);c.stroke();c.restore();}}}

    const loop=()=>{const now=performance.now(),T=(now-t0)/1000,dt=Math.min(.05,(now-lt)/1000);lt=now;g.fillStyle='#0b3024';g.fillRect(0,0,260,160);
      const hx=70,hy=100,ex=205,ey=86,cyc=T%1.4,alive=cyc<1.1;

      const k=Math.floor(T/1.4);if(!alive&&k!==lastK){lastK=k;if(x.cat==='kill')killFx(ex,ey,x,emit,r=>rings.push(r),false);else for(let i=0;i<8;i++){const a=Math.random()*TAU,v=40+Math.random()*90;emit({x:ex,y:ey,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5,col:'#6fae45'});}}

}

async function submitScore(nick,comment,run){

// 자동 선택: 등급, 공격 기여, 직업 전용, 합체, 시너지 단계 도달을 함께 고려
function scoreAug(a){
  if(a.up)return 2+(3-a.ref.lv)+(isOff(a.ref)?2.5:0)+({s:0,g:.5,p:1}[a.ref.t]||0);
  let sc={s:1,g:2.5,p:4}[a.t]||1;
  if(a.fuseNow)sc+=20;else if(partnerOf(a.id))sc+=5;
  if(isOff(a))sc+=4;if(a.cls)sc+=3;
  const cnt={};for(const t of a.tags)cnt[t]=(cnt[t]||0)+1;
  for(const t in cnt){const c=tag(t),n=c+cnt[t];sc+=c*1.2;for(const th of [2,4,6])if(c<th&&n>=th)sc+=th;}
  if(S.p.hp<S.p.maxHp*.4&&!isOff(a))sc+=2;
  return sc+Math.random()*.8;
}
function autoAug(){
  const full=slotCount()>=MAXA,opts=full?fullOptions().filter(a=>!a.swap):augOptions(rollTier());
  if(!opts.length){autoStat();return;}
  const a=opts.reduce((b,c)=>scoreAug(c)>scoreAug(b)?c:b,opts[0]);
  if(a.up){const o=a.ref;o.lv++;if(o.f)applyQ(o.f,S.p,o.q);tagCount();ftext(S.p.x,S.p.y-40,o.n+' ★'+o.lv,'#ffd76a',15);tryFuse();return;}
  gainAug(a);
}
const BADCARD=['러시안 룰렛','동전 던지기','도박꾼의 주사위','올인'];
const OFFCARD=['숫돌','힘의 물약','날랜 손놀림','치명상','급소 노리기','전투 본능','유리 대포','광기','쾌속 장전','사냥꾼의 눈','다연발','관통 탄'];
function autoStat(){
  const cards=[];let tries=0;while(cards.length<3&&tries<60){tries++;const c=cardOf(rollRarity());if(!cards.some(x=>x.n===c.n))cards.push(c);}
  const sc=c=>({c:1,r:2,e:3.5,l:5}[c.r])-(BADCARD.includes(c.n)?5:0)+(OFFCARD.includes(c.n)?1.2:0)+(c.u!=null?c.u:.4)+Math.random()*.5;
  const c=cards.reduce((b,x)=>sc(x)>sc(b)?x:b,cards[0]);c.f(S.p);tryFuse();
  ftext(S.p.x,S.p.y-28,c.n,'#5fc9d9',14);

function autoMoveVec(){
  const p=S.p,N=16,STEP=100,M=70;

  const A=S.arena,X0=A?A.x-A.r:0,X1=A?A.x+A.r:WW,Y0=A?A.y-A.r:0,Y1=A?A.y+A.r:WH,CX=(X0+X1)/2,CY=(Y0+Y1)/2,inA=o=>o.x>X0+M&&o.x<X1-M&&o.y>Y0+M&&o.y<Y1-M;

  {let bd=600*600;for(const i of S.items){const d=d2(i,p);if(d<bd&&inA(i)){bd=d;goal=i;}}}
  if(!goal){let bd=320*320;for(const q of S.dr){const d=d2(q,p);if(d<bd&&d>p.magnet*p.magnet*.4&&inA(q)){bd=d;goal=q;}}}
  let best=-1e9,ba=0,danger=0;
  for(const e of near){const d=Math.sqrt(d2(e,p));if(d<160)danger+=1;}
  for(let i=0;i<N;i++){
    const a=i*TAU/N,cx=Math.cos(a),cy=Math.sin(a),tx=p.x+cx*STEP,ty=p.y+cy*STEP;
    let sc=0;
    const edge=Math.min(tx-X0-M,X1-M-tx,ty-Y0-M,Y1-M-ty);
    if(edge<0)sc-=5000-edge*10;else if(edge<250)sc-=(250-edge)*1.2;
    if(inSolid(tx,ty,p.r+6)||inSolid(p.x+cx*STEP*.5,p.y+cy*STEP*.5,p.r+4)||inSolid(p.x+cx*30,p.y+cy*30,p.r+2))sc-=900;
    let mn=420;
    for(const e of near){const w=e.elite?1.6:e.boss?1.2:1;const d=Math.hypot(e.x-tx,e.y-ty)/w;if(d<mn)mn=d;
      const dot=((e.x-p.x)*cx+(e.y-p.y)*cy)/(Math.hypot(e.x-p.x,e.y-p.y)||1);if(dot>.6)sc-=40*dot*(1-Math.min(1,Math.hypot(e.x-p.x,e.y-p.y)/300));}
    sc+=Math.min(mn,desired)*2.2;

    // 탄환은 현재 위치가 아니라 앞으로 0.6초간 날아갈 경로 기준으로 회피
    for(const b of shots){const ex=b.vx*.6,ey=b.vy*.6,L2=ex*ex+ey*ey||1,u=clamp(((tx-b.x)*ex+(ty-b.y)*ey)/L2,0,1),d=Math.hypot(b.x+ex*u-tx,b.y+ey*u-ty),R0=(b.r||5)+p.r+22;if(d<R0)sc-=(R0-d)*6;}
    // 보스전: 보스를 사거리 안 적정 거리(사거리의 70%, 최소 보스 몸통+70)에 두도록 유도
    // 사거리 끝 쪽(85%)에서 때리고, 가까이 붙는 쪽을 더 크게 감점. 보스 몸통+120 안쪽은 금지 수준
    if(bossOn){const e=S.boss,want=Math.max(e.r+p.r+90,p.range*(low?.88:.74)),db=Math.hypot(e.x-tx,e.y-ty);sc-=db<want?(want-db)*2.4:db>p.range*.95?(db-p.range*.95)*3:0;}
    // 보스 예고 공격·장판 회피
    for(const t of S.tele){if(!t.dmg&&t.k==='c')continue;

      else{const ux=Math.cos(t.a),uy=Math.sin(t.a),px2=tx-t.x,py2=ty-t.y,u=clamp(px2*ux+py2*uy,0,t.len),dd=Math.hypot(px2-ux*u,py2-uy*u);if(dd<t.w/2+p.r+16)sc-=900;}}
    for(const h of S.hz){const d=Math.hypot(h.x-tx,h.y-ty);if(d<h.r+p.r+6)sc-=500;}
    if(S.boss&&S.boss.beams&&S.boss.beams.on!==undefined){const e=S.boss,B=e.beams;for(let k=0;k<B.n;k++){const a2=B.a+B.rot*.35+k*TAU/B.n,ux=Math.cos(a2),uy=Math.sin(a2),px2=tx-e.x,py2=ty-e.y,u=clamp(px2*ux+py2*uy,0,B.len),dd=Math.hypot(px2-ux*u,py2-uy*u);if(dd<B.w/2+p.r+24)sc-=700;}}
    if(goal&&danger<2){const gd=Math.hypot(goal.x-tx,goal.y-ty);sc+=Math.max(0,300-gd)*.8;}
    sc+=-Math.hypot(CX-tx,CY-ty)*(A?.05:.02);
    if(p.amA!==undefined){let df=Math.abs(a-p.amA);if(df>Math.PI)df=TAU-df;sc-=df*6;}
    if(sc>best){best=sc;ba=a;}
  }
  if(!wide.length&&!goal&&!shots.length){const a=S.t*.35;ba=Math.atan2(Math.sin(a)+(CY-p.y)/(A?600:1500),Math.cos(a)+(CX-p.x)/(A?600:1500));}

  return [vx,vy];
}

function bgmNote(f,t,d,type,vol){const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+d+.02);}

  if(boss||st%2===0)bgmNote(mf(ch[0]-12),t,beat*(boss?.9:1.8),'triangle',.22);

function bgmTick(){

  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const x=STACKS[+b.dataset.k],c=stackCost(x);if(S.gold<c||stackCapped(x))return;S.gold-=c;S.buys[x.k]=(S.buys[x.k]||0)+1;x.f(S.p);S.p.luck=Math.min(LUCK_CAP,S.p.luck);re();});
  ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const a=S.augs[+b.dataset.u],c=Math.round(upCost(a)*.85);if(S.gold<c||a.lv>=3)return;S.gold-=c;a.lv++;if(a.f)applyQ(a.f,S.p,a.q);tagCount();toast(`${a.n} ★${a.lv}`);tryFuse();re();});
  ov.querySelectorAll('[data-fz]').forEach(b=>b.onclick=()=>{const f=FUSIONS.find(x=>x.id===b.dataset.fz),c=fuseCost();if(S.gold<c||!fusable().includes(f))return;S.gold-=c;doFuse(f);re();});
  ov.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{m.disc=+b.dataset.disc;re();});
  ov.querySelectorAll('[data-dis]').forEach(b=>b.onclick=()=>{const a=S.augs[+b.dataset.dis];if(!a)return;S.gold+=price(40*a.lv);S.augs.splice(+b.dataset.dis,1);m.disc=null;tagCount();toast(`${a.n} 지움`);re();});
  ov.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{const k=b.dataset.doc,p=S.p;
    if(k==='heal'){const c=price(55);if(S.gold<c)return;S.gold-=c;p.hp=p.maxHp;m.used.heal=1;}
    if(k==='max'){const c=price(70*Math.pow(1.35,S.buys.doc||0));if(S.gold<c)return;S.gold-=c;S.buys.doc=(S.buys.doc||0)+1;p.maxHp+=22;p.hp+=22;}
    if(k==='token'){const c=price(320);if(S.gold<c||p.token)return;S.gold-=c;p.token=true;}
    re();});
  ov.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{const d=DEALS.find(x=>x.id===b.dataset.deal),c=d.cost();if(m.used[d.id]||c>S.gold)return;S.gold-=c;m.used[d.id]=1;const r=d.f();toast(d.n+(r?': '+r:''));re();});
  ov.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=VIPS.find(x=>x.id===b.dataset.v),c=vipCost();if((S.keys||0)<c||has(v.id))return;S.keys-=c;S.augs.push({...v,lv:3});tagCount();toast('VIP '+v.n);re();});
  ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{m.tab=b.dataset.tab;m.disc=null;re();});
  ov.querySelectorAll('[data-gb]').forEach(b=>b.onclick=()=>{const k=b.dataset.gb,p=S.p;
    if(k==='box'){const c=boxC();if(S.gold<c)return;S.gold-=c;S.cbuys.box=cb('box')+1;const cd=cardOf(rollRarity(3),3);const res=cd.f(p);m.log=`능력치 상자: <span style="color:${RAR[cd.r].col};filter:brightness(1.5)">[${RAR[cd.r].n}]</span> ${cd.n} · ${res||cd.d}`;}
    if(k==='double'){if(m.used.double||S.gold<1)return;m.used.double=1;const bet=S.gold;if(Math.random()<.45+LK()*.005){S.gold+=bet;m.log=`더블 오어 낫싱: 앞면! ${bet} 골드를 따서 ${S.gold} 골드`;}else{S.gold=0;m.log=`더블 오어 낫싱: 뒷면. ${bet} 골드를 전부 잃었습니다`;}}
    re();});
  $('upBack').onclick=back;{const t=$('upBackTop');if(t)t.onclick=back;}
}


/* ---------- stats ---------- */
let statsOpen=false;
const stEl=$('st');
function toggleStats(){statsOpen=!statsOpen;joy=null;{const pp=document.getElementById('stipPop');if(pp)pp.style.display='none';}if(statsOpen){renderStats();stEl.classList.add('on');}else{stEl.classList.remove('on');stEl.innerHTML='';}}
$('statBtn').addEventListener('click',()=>{if(S&&S.mode!=='start')toggleStats();});
// 스탯 설명 (PC는 마우스를 올리면, 모바일은 누르면 표시)
const STAT_TIP={
  '공격력':'탄환 한 발의 기본 피해. 카드·상점·레벨업으로 얻은 공격력 %는 모두 더해서 한 번에 곱합니다 (합연산). 거의 모든 피해(폭발, 독, 회전 칩, 반격 등)가 이 값에 비례합니다.',
  '공격 속도':'초당 공격 횟수. 공격 속도 %도 모두 더해서 한 번에 곱합니다 (합연산). 상한을 넘는 만큼은 버려지지 않고 공격력 보너스로 바뀝니다 (초과 1%당 공격력 +0.5%).',
  '치명타 확률':'공격이 치명타로 터질 확률. 100%가 상한이고, 넘는 만큼은 치명타 피해로 바뀝니다.',
  '치명타 피해':'치명타가 터졌을 때 피해 배율. 200%면 2배. 500%가 상한입니다.',
  '탄환 수':'한 번 공격할 때 동시에 나가는 탄환 수. 모든 피해에 곱해지는 강력한 스탯입니다.',
  '관통':'탄환 하나가 적을 몇 명 더 뚫고 지나가는지.',
  '사거리':'이 거리 안의 가장 가까운 적을 자동으로 공격합니다. 기사·도적은 사거리만큼만 탄이 날아갑니다.',
  '기대 초당 피해':'공격력 × 공격 속도 × 탄환 수 × 치명타 기댓값. 회전 칩, 폭발, 독, 증강 효과는 빠져 있어 실제 피해는 더 높습니다.',
  '최대 체력':'버틸 수 있는 피해량. 레벨업할 때마다 최대 체력의 10%를 회복합니다.',
  '방어력':'받는 피해를 100/(100+방어력) 배로 줄입니다. 방어력 100이면 절반. 상한은 없지만 쌓을수록 효율이 줄어듭니다.',
  '막기':'기사 고유. 이 확률로 받는 피해를 완전히 무효로 합니다. 회피와 별개로 굴립니다.',
  '회피':'이 확률로 공격을 완전히 피합니다. 60%가 상한이고, 넘는 1%마다 방어력 +2로 바뀝니다.',
  '보호막':'체력보다 먼저 깎이는 추가 체력. 3초 동안 안 맞으면 다시 차오릅니다.',
  '체력 재생':'초당 자동으로 회복하는 체력.',
  '흡혈':'입힌 피해의 이 비율만큼 체력을 회복합니다.',
  '받는 피해 배율':'받는 피해에 곱해지는 값. 1보다 크면 더 아프게 맞습니다 (올인, 광기 카드 등).',
  '이동 속도':'230이 상한. 넘는 10마다 공격 속도 +3%로 바뀝니다.',
  '대시 재사용':'대시를 다시 쓸 수 있을 때까지 걸리는 시간. 대시 중에는 무적입니다.',
  '회전 칩':'내 주변을 돌며 닿는 적에게 피해를 주는 칩 개수. 공격력의 50%가 기본 피해입니다.',
  '흡수 범위':'경험치와 골드를 끌어당기는 거리.',
  '행운':'30이 상한. 0~30 구간에서 고르게 효과가 오릅니다: 스탯 카드 영웅·전설 확률(행운 0: 4.6%·0.6% → 30: 7.5%·1.7%), 스탯 카드 수치, 증강 프리즘 확률, 자동 합체 확률(10→25%), 아이템 드롭(최대 2배), 카지노 승률(45→60%)과 슬롯 결과.',
  '부활 비용':'죽었을 때 이만큼 골드가 있으면 체력 50%로 부활할 수 있습니다. 쓸 때마다 비싸집니다.',
  '골드 획득':'주운 골드에 곱해지는 배율.',
  '고유 능력':'직업마다 처음부터 가진 능력. 증강 없이도 항상 적용됩니다.',
  '레벨당 상승':'레벨이 오를 때마다 직업별로 자동으로 오르는 스탯. 스탯 카드와 별개입니다.',
  '선호 시너지':'이 태그가 붙은 증강이 선택지에 더 자주 나옵니다 (×2.5). 비선호 태그는 덜 나옵니다 (×0.3).',
  '전용 증강':'이 직업만 얻을 수 있는 증강. 일반 증강보다 잘 나옵니다. ✔는 보유 중.'
};
function renderStats(){
  const p=S.p,raw=rawRate(),rate=pRate(),ar=armorEff(),red_=ar/(ar+100),n=p.multi+(tag('card')>=6?2:0);
  const pct=v=>(v*100).toFixed(v<.1&&v>0?1:0)+'%';
  const tip=k=>STAT_TIP[k.replace(/ \d+$/,'')]||'';
  const row=(k,v,note,ct)=>{const t=ct||tip(k);return `<div class="sitem"${t?' data-tip="1"':''}><div class="srow"><span>${k}${t?'<span class="qi">ⓘ</span>':''}</span><b>${v}</b></div>${note?`<div class="snote">${note}</div>`:''}${t?`<div class="stip">${t}</div>`:''}</div>`;};
  const dps=pDmg()*rate*n*(1+critC()*(critMul()-1));
  const bonus=[];
  if(tag('house')>=2)bonus.push(`하우스 골드 보너스 +${Math.round(Math.min(.6,Math.floor(S.gold/50)*.04)*100)}%`);
  if(has('bankrupt')&&S.gold===0)bonus.push('빚쟁이 ×2');
  if(has('deathwish'))bonus.push(`죽음의 소원 +${Math.round((1-p.hp/p.maxHp)*100)}%`);
  if(raw>RATE_CAP())bonus.push(`공속 초과 ×${(1+(raw/RATE_CAP()-1)*.5).toFixed(2)}`);
  const atk=[
    row('공격력',pDmg().toFixed(1),`기본 ${p.dmg.toFixed(1)} × (1 + 보너스 합계 ${Math.round((p.dmgP||0)*100)}%)`+(bonus.length?`, ${bonus.join(', ')}`:'')),
    row('공격 속도',rate.toFixed(2)+`회/초 <small>/ ${RATE_CAP()}</small>`,raw>RATE_CAP()?`상한 초과 ${Math.round((raw/RATE_CAP()-1)*100)}% → 공격력 ×${(1+(raw/RATE_CAP()-1)*.5).toFixed(2)}`:''),
    row('치명타 확률',pct(critC())+' <small>/ 100%</small>',critRaw()>CRIT_CAP?`초과 ${Math.round((critRaw()-CRIT_CAP)*100)}% → 치명타 피해 +${Math.round((critRaw()-CRIT_CAP)*50)}%`:critFull()?'최대치. 치명타 확률 카드가 더 안 나와요':''),
    row('치명타 피해',pct(critMul())+' <small>/ 500%</small>',critMFull()?'최대치 500%. 치명타 피해 카드가 더 안 나와요':''),
    row('탄환 수',n+'발'),
    row('관통',p.pierce),
    row('사거리',Math.round(p.range)),
    row('기대 초당 피해',Math.round(dps),'탄환 기본 피해 기준. 회전 칩, 폭발, 독 제외')
  ].join('');
  const def=[
    row('최대 체력',Math.round(p.maxHp)),
    row('방어력',Math.round(ar),`받는 피해 −${pct(red_)}`+(p.dodge>DODGE_CAP?`, 회피 초과분 +${Math.round((p.dodge-DODGE_CAP)*200)} 포함`:'')+(has('iron')&&p.hp<p.maxHp*.5?', 철의 의지 ×2 적용 중':'')),
    row('회피',pct(dodgeC())+' <small>/ 60%</small>',p.dodge>DODGE_CAP?`초과 ${Math.round((p.dodge-DODGE_CAP)*100)}% → 방어력 +${Math.round((p.dodge-DODGE_CAP)*200)}`:''),
    ...(p.block?[row('막기',pct(p.block+(has('k_wall')?lv3('k_wall',.15,.2,.25):0)),'막으면 피해 무효')]:[]),
    row('보호막',Math.round(barrierMax())),
    row('체력 재생',p.regen.toFixed(1)+'/초'),
    row('흡혈',pct(p.lifesteal)),
    row('받는 피해 배율','×'+p.vuln.toFixed(2))
  ].join('');
  const util=[
    row('이동 속도',Math.round(Math.min(SPEED_CAP,moveSpd()))+' <small>/ 230</small>',moveSpd()>SPEED_CAP?`상한 230 초과 ${Math.round(moveSpd()-SPEED_CAP)} → 공격 속도 +${Math.round((moveSpd()-SPEED_CAP)/10*3)}%`:''),
    row('대시 재사용',dashCdVal().toFixed(2)+'초'),
    row('회전 칩',orbitN()+'개'),
    row('흡수 범위',Math.round(p.magnet)),
    row('행운',(+Math.min(p.luck,LUCK_CAP).toFixed(1))+' <small>/ 30</small>',p.luck>LUCK_CAP?`초과 ${(p.luck-LUCK_CAP).toFixed(1)}은 효과 없음`:''),
    row('부활 비용',reviveCost()+'골드'),
    row('골드 획득','×'+(p.goldM*(has('bankrupt')?.7:1)).toFixed(2))
  ].join('');
  const syn=Object.keys(TAGS).filter(t=>tag(t)>0).map(t=>{const c=tag(t),T=TAGS[t],on=[1,2,4,6].filter(k=>c>=k&&T['t'+k]).map(k=>T['t'+k]);if(c>=5)on.push(`초과 ${c-4}개: ${T.ex} ×${c-4}`);const L=(n,x)=>`<div style="color:${c>=n?'var(--brass)':'var(--muted)'}">${c>=n?'✔':'·'} ${n}개: ${x}</div>`;
    return row(`${T.n} ${c}`,on.length?(c>=5?'초과 +'+(c-4):on.length+'단계'):'-','',`${T.t1?L(1,T.t1):''}${L(2,T.t2)}${L(4,T.t4)}${L(6,T.t6)}<div style="color:${c>=5?'var(--brass)':'var(--muted)'}">${c>=5?'✔':'·'} 5개부터 1개마다: ${T.ex}</div>`);}).join('')||'<p class="sub">아직 없음</p>';
  stEl.innerHTML=`<div class="panel"><div class="shophead"><h2>내 스탯</h2><button class="btn" id="stCloseTop" aria-label="닫기" style="min-width:48px;font-size:20px">✕</button></div><p class="sub">${CLASSES[S.cls].n}. ${CLASSES[S.cls].passive}. ${Math.floor(S.gt/60)}분 ${Math.floor(S.gt%60)}초, 레벨 ${S.lvl}. 열려 있는 동안 게임이 멈춥니다.</p>
  <h3>직업: ${CLASSES[S.cls].n} <small style="color:var(--muted);font-size:13px">${CLASSES[S.cls].role}</small></h3>
  ${row('고유 능력',' ',CLASSES[S.cls].passive)}${row('레벨당 상승',`${S.lvl-1}회 누적`,CLASSES[S.cls].lvd)}
  <div class="sgrid"><div class="sgrp"><h3>공격</h3>${atk}</div><div class="sgrp"><h3>방어</h3>${def}<h3>유틸</h3>${util}</div></div>
  <h3>시너지</h3>${syn}
  <h3 title="일반 증강은 최대 ${MAXA}개. VIP 증강은 슬롯을 차지하지 않습니다. 슬롯이 가득 차면 합체 짝이 되는 증강만 나옵니다">증강 슬롯 ${slotCount()}/${MAXA}${S.augs.length>slotCount()?` (+VIP ${S.augs.length-slotCount()})`:''}</h3>${S.augs.map(a=>row(a.n,(a.t==='v'?'VIP':a.t==='f'?'합체':''),'',`<b style="color:${(TIER[a.t]||{}).col||'var(--brass)'};filter:brightness(1.4)">${(TIER[a.t]||{n:''}).n}</b> · ${a.tags.map(t=>TAGS[t].n).join(', ')}<br>${a.d}${a.u&&a.t!=='v'&&a.t!=='f'?`<br><span style="color:var(--muted)">강화하면: ${a.u}</span>`:''}`)).join('')||'<p class="sub">없음</p>'}
  <div class="btnrow"><button class="btn" id="stSave">저장</button><button class="btn" id="stQuit">저장하고 메인으로</button></div>
  <button class="btn primary" id="stClose">닫기</button></div>`;
  $('stClose').onclick=toggleStats;$('stCloseTop').onclick=toggleStats;
  {let pop=document.getElementById('stipPop');if(!pop){pop=document.createElement('div');pop.id='stipPop';document.body.appendChild(pop);}
   const place=(x,ev)=>{pop.innerHTML=x.querySelector('.stip').innerHTML;pop.style.display='block';const r=x.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
     let lx=ev&&ev.clientX!=null?ev.clientX+14:r.left,ly=ev&&ev.clientY!=null?ev.clientY+16:r.bottom+4;if(lx+pw>innerWidth-8)lx=innerWidth-pw-8;if(ly+ph>innerHeight-8)ly=r.top-ph-6;pop.style.left=Math.max(8,lx)+'px';pop.style.top=Math.max(8,ly)+'px';};
   stEl.querySelectorAll('.sitem[data-tip]').forEach(x=>{x.onmouseenter=e=>place(x,e);x.onmousemove=e=>place(x,e);x.onmouseleave=()=>{pop.style.display='none';};
     x.onclick=e=>{if(pop.style.display==='block'&&pop.dataset.k===x.textContent){pop.style.display='none';return;}pop.dataset.k=x.textContent;place(x,e);};});}
  $('stSave').onclick=()=>{saveGame(false);};
  $('stQuit').onclick=()=>{if(saveGame(false)){toggleStats();newRun();startScreen();}};
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(statsOpen){}else if(S.mode==='play'||S.mode==='dying'){const n=AUTO.speed||1;for(let i=0;i<n;i++){if(S.mode!=='play'&&S.mode!=='dying')break;update(dt);}}else fx(dt);
  if(S.mode==='start')drawPreviews();
  if(S.mode==='play'){autoT+=dt;if(autoT>15){autoT=0;saveGame(true);}}
  draw();hud();requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();newRun();startScreen();requestAnimationFrame(loop);
})();
</script>
