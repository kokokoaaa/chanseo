<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찬서 : 찬붕이의 뱀서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0e3a2c; --felt-deep:#072219; --brass:#d6a94a; --chip-red:#c8323a;
  --ivory:#f1e7cf; --ink:#04120c; --muted:#a9c2b2; --prism:#c56ce0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --felt:#0b3024; --felt-deep:#051a13; } }
:root[data-theme="dark"]{ --felt:#0b3024; --felt-deep:#051a13; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--felt-deep);color:var(--ivory);font-family:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 14px;pointer-events:none;font-family:'Do Hyeon',system-ui,sans-serif;font-size:17px;text-shadow:0 1px 2px #000}
.bar{position:relative;width:150px;height:18px;background:rgba(0,0,0,.5);border:1px solid rgba(214,169,74,.7);border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--chip-red)}
.bar span{position:relative;display:block;text-align:center;font-size:14px;line-height:17px}
.gold{color:var(--brass)}
#botLeft{position:absolute;left:10px;bottom:14px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 120px);pointer-events:none;z-index:6}
/* 레벨업·상점·스탯 창이 열려 멈춰 있어도 증강 아이콘을 볼 수 있게 위에 띄우고, 창 내용은 아이콘 줄에 가리지 않게 아래 여백 */
#ov>.panel,#st>.panel{margin-bottom:125px}
#augBar{display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto}
#augBar:empty{display:none}
.aico{width:38px;height:40px;border-radius:7px;border:2px solid var(--ac);background:rgba(4,18,12,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Do Hyeon',sans-serif;cursor:help;box-shadow:0 0 6px color-mix(in srgb,var(--ac) 45%,transparent);user-select:none;-webkit-user-select:none}
.aico i{font-style:normal;font-size:17px;line-height:1}
.aico span{font-size:10px;color:#f1e7cf;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;max-width:34px}
.aico.uc{border:2px solid transparent;background:linear-gradient(160deg,#3a0d12,#3a1f06) padding-box,linear-gradient(90deg,#ff2e4d,#ffb000,#fff2a8,#ff7a00,#ff2e4d) border-box;background-size:100% 100%,300% 100%;animation:prz 1.8s linear infinite,ucs 1.1s ease-in-out infinite alternate}
.aico.uc i{color:#ffd76a;text-shadow:0 0 6px #ff8a00;font-weight:700}
.aico.uc span{color:#ffe3a8}
@keyframes ucs{from{box-shadow:0 0 4px 1px rgba(255,90,30,.55)}to{box-shadow:0 0 12px 4px rgba(255,180,40,.85)}}
.aico.empty{border-style:dashed;border-color:rgba(241,231,207,.22);box-shadow:none;cursor:default}
.aico.empty.vip{border-color:rgba(255,215,106,.45)}.aico.empty.vip i{opacity:.35;font-size:14px}
.vipgap{width:8px;flex:none}
.mtile.poor{opacity:.5;cursor:help}
/* 생일 축하 배너 */
.bday{text-align:center;margin:0 0 10px;font-family:"Do Hyeon",sans-serif;font-size:clamp(17px,4.9vw,36px);white-space:nowrap;line-height:1.2;letter-spacing:1px;animation:bdayBob 1.6s ease-in-out infinite}
.bday .bt{background:linear-gradient(90deg,#ff4f6a,#ffb347,#ffe66a,#7be08f,#5fc9f8,#b07aff,#ff4fd8,#ff4f6a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bdayFlow 3s linear infinite;filter:drop-shadow(0 0 6px rgba(255,215,106,.7)) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.bday .em{display:inline-block;animation:bdaySpin 2s ease-in-out infinite}.bday .em:last-child{animation-delay:-1s}
.bday .sp{display:block;font-size:.42em;color:#ffd76a;letter-spacing:6px;opacity:.9;animation:bdayTw 1.2s ease-in-out infinite}
@keyframes bdayFlow{to{background-position:300% 0}}@keyframes bdayBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bdaySpin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.2)}}@keyframes bdayTw{0%,100%{opacity:.35}50%{opacity:1}}
#cosPrev{position:fixed;z-index:260;display:none;padding:6px;background:#0b1f18;border:1px solid var(--brass);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.6);pointer-events:none}
#cosPrev canvas{display:block;width:260px;height:160px;image-rendering:pixelated;border-radius:6px}
#augTip{position:fixed;z-index:250;display:none;max-width:260px;background:rgba(4,18,12,.96);border:1px solid var(--ac,#d6a94a);border-radius:8px;padding:8px 10px;font-family:'Do Hyeon',sans-serif;font-size:14px;color:#f1e7cf;pointer-events:none;line-height:1.35}
#augTip b{display:block;font-size:16px;font-weight:400;color:var(--ac,#d6a94a)}
#augTip small{display:block;color:var(--muted);font-size:12px;margin:2px 0 4px}
@media (max-width:520px){.aico{width:32px;height:34px}.aico i{font-size:14px}.aico span{font-size:9px;max-width:29px}}
#syn{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;font-family:'Do Hyeon',sans-serif;font-size:15px}
.pill{padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(241,231,207,.25);color:var(--muted)}
.pill[data-tg]{cursor:help}
.hx-hf_gold{color:#ffd76a;text-shadow:0 0 8px rgba(255,215,106,.8)}
.hx-hf_fire{background:linear-gradient(90deg,#ff3d1f,#ffb347,#ffe27a,#ff3d1f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hfm 1.6s linear infinite;filter:drop-shadow(0 0 6px rgba(255,120,40,.7))}
.hx-hf_rainbow{background:linear-gradient(90deg,#ff5ad8,#ffd76a,#7be08f,#5fc9d9,#b552d6,#ff5ad8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hfm 2.4s linear infinite}
.hx-hf_crown{color:#ffd76a;text-shadow:0 0 10px rgba(255,215,106,.9),0 0 22px rgba(255,170,40,.6)}
@keyframes hfm{to{background-position:200% 0}}
.hc-hf_neon{box-shadow:0 0 0 2px #5fc9d9,0 0 16px rgba(95,201,217,.8)!important}
.hc-hf_crown{box-shadow:0 0 0 2px #ffd76a,0 0 20px rgba(255,215,106,.75)!important;background:linear-gradient(180deg,rgba(255,215,106,.18),transparent)!important}
#augTip .tl{display:block;color:var(--muted)}
#augTip .tl.on{color:#f1e7cf}
#augTip .tl.on::before{content:'✔ ';color:#7be08f}
.pill.on2{border-color:var(--brass);color:var(--brass)}
.pill.on4{border-color:var(--prism);color:#e7b6f5;background:rgba(80,20,100,.45)}
.pill.on6{border-color:#fff;color:#fff;background:linear-gradient(90deg,rgba(200,50,58,.6),rgba(197,108,224,.6),rgba(95,201,217,.6))}
#dash{position:absolute;right:16px;bottom:22px;width:84px;height:84px;border-radius:50%;border:2px solid var(--brass);background:rgba(4,18,12,.6);color:var(--ivory);font-family:'Do Hyeon',sans-serif;font-size:20px;display:none;touch-action:none}
#dash.cd{opacity:.4}
#spinBtn{position:absolute;right:110px;bottom:22px;width:68px;height:68px;border-radius:50%;border:2px solid var(--chip-red);background:rgba(60,8,12,.6);color:var(--ivory);font-family:'Do Hyeon',sans-serif;font-size:17px;display:none;touch-action:none;cursor:pointer}
#spinBtn small{display:block;font-size:11px;color:var(--brass)}
#spinBtn:disabled{opacity:.4}
#live{position:absolute;left:50%;top:92px;transform:translateX(-50%);display:none;gap:6px;pointer-events:none}
#live.on{display:flex}
#live span{width:46px;height:46px;background:var(--ivory);border:2px solid var(--brass);border-radius:8px;display:grid;place-items:center;font-size:26px}
#mini{position:absolute;right:12px;bottom:118px;width:130px;height:130px;border:2px solid rgba(214,169,74,.7);border-radius:10px;background:rgba(4,20,14,.75);pointer-events:none;display:none}
@media (max-width:520px){#mini{width:104px;height:104px;bottom:112px}}
#autoBar{position:absolute;right:12px;top:48px;z-index:46;display:none;gap:6px}
#autoBar button{background:rgba(4,18,12,.65);color:var(--muted);border:1px solid rgba(241,231,207,.3);border-radius:8px;padding:5px 10px;font-family:'Do Hyeon',sans-serif;font-size:14px;cursor:pointer}
#autoBar #speedBtn{min-width:44px;font-size:16px}
#autoBar button.on{color:#04120c;background:#7be08f;border-color:#7be08f}
#buffs{position:absolute;right:12px;top:84px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;font-family:'Do Hyeon',sans-serif;font-size:15px}
#buffs{z-index:40}
#buffs .dpsbox{display:flex;flex-direction:column;gap:2px;min-width:250px;max-width:330px;padding:5px 8px;background:rgba(6,14,10,.78);border:1px solid rgba(214,169,74,.45);border-radius:8px;pointer-events:auto;cursor:pointer;font-family:inherit}
#buffs .dpsbox b{font-weight:400;color:var(--brass);font-size:14px}
#buffs .dpsbox i{position:relative;display:flex;justify-content:space-between;gap:8px;font-style:normal;font-size:13px;color:#f1e7cf;padding:1px 4px;background:none}
#buffs .dpsbox i em{position:absolute;left:0;top:0;bottom:0;background:rgba(255,154,106,.3);border-radius:3px;z-index:0}
#buffs .dpsbox i span{background:none;padding:0;position:relative;z-index:1}
#buffs .dpsbox i span:last-child{color:#cfc4a8;white-space:nowrap}
#buffs span[data-tip]{pointer-events:auto;cursor:help}
#buffs span[data-tip]::after{content:' ⓘ';opacity:.6;font-size:12px}
#bfTip{position:fixed;z-index:400;display:none;max-width:320px;padding:8px 10px;border-radius:8px;background:rgba(8,16,12,.96);border:1px solid var(--brass);color:#f1e7cf;font-size:13px;line-height:1.5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#bfTip b{color:var(--brass)}
#buffs>span{background:rgba(8,20,14,.62);padding:1px 8px;border-radius:9px;line-height:1.35}
#buffs span{background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px}
@media (max-width:520px){#autoBar{flex-direction:column;align-items:flex-end;top:54px}#autoBar button{padding:3px 7px;font-size:12px}#autoBar #speedBtn{font-size:14px}#buffs{top:186px}}
.shophead{position:sticky;top:-22px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--felt);margin:-22px -20px 6px;padding:16px 20px 10px;border-bottom:1px solid rgba(214,169,74,.3);border-radius:16px 16px 0 0}
.shophead h2{margin:0}
.cwrap{display:flex;flex-direction:column;gap:6px;min-width:0}.cwrap>.card{flex:1}
.sealb{font:inherit;font-size:13px;padding:5px 6px;border-radius:8px;border:1px dashed rgba(255,154,154,.7);background:rgba(60,10,16,.55);color:#ffc4c4;cursor:pointer}
.sealb:hover{background:rgba(120,20,30,.7);color:#fff}
.sealb small{opacity:.75}
.dlog{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px}.dlog div{position:relative;display:flex;justify-content:space-between;padding:3px 8px;font-size:14px;border-radius:5px;background:rgba(0,0,0,.25)}.dlog em{position:absolute;left:0;top:0;bottom:0;background:rgba(255,154,106,.3);border-radius:5px}.dlog span{position:relative}
.cxbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cxbar input,.cxbar select{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid rgba(214,169,74,.6);background:rgba(0,0,0,.35);color:var(--ivory)}
.cxbar input{flex:1;min-width:160px}
.cxtab{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(214,169,74,.55);background:rgba(0,0,0,.25);color:var(--ivory);cursor:pointer}
.cxtab.on{background:var(--brass);color:#1b1206;font-weight:700}
.cxchip{font:inherit;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--ivory);cursor:pointer}
.cxchip.on{border-color:var(--brass);background:rgba(214,169,74,.3)}
.cxcnt{color:var(--muted);font-size:13px;margin:4px 0}
.cxrow{border:1px solid rgba(214,169,74,.35);border-left:4px solid var(--rc,#999);border-radius:8px;padding:8px 10px;margin:6px 0;background:rgba(0,0,0,.25);text-align:left}
.cxrow .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cxrow .h b{font-size:16px;color:var(--ivory)}
.cxrow .tg{font-size:12px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--ivory)}
.cxrow .d{font-size:14px;color:#e8dcc0;margin-top:3px;line-height:1.45}
.cxrow .s{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.cxrow.uc{border-left-color:#ff6a00;box-shadow:inset 0 0 0 1px rgba(255,120,40,.35)}
.clsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.clscard{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.25);border:2px solid rgba(214,169,74,.3);border-radius:10px;padding:6px 4px 9px;color:var(--ivory);font:inherit;cursor:pointer;text-align:center;opacity:.75;transition:opacity .15s,transform .15s}
.clscard:hover{opacity:1}
.clscard.on{opacity:1;border-color:var(--brass);background:rgba(214,169,74,.16);box-shadow:0 0 0 2px rgba(214,169,74,.25);transform:translateY(-2px)}
.clscard canvas{width:84px;height:84px;image-rendering:pixelated}
.clscard.locked canvas{filter:brightness(0) opacity(.55)}.clscard.locked{opacity:.8}
.clscard b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px}
.clscard .role{font-size:12px;color:var(--brass)}
.cdet{margin-top:10px;padding:14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(214,169,74,.45)}
.cdet .ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cdet .ch b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:24px;color:var(--brass)}
.cdet .ch span{font-size:13px;color:var(--muted)}
.cdet .cd{margin:4px 0 12px;color:var(--ivory);font-size:14.5px}
.cdet .cp{padding:9px 11px;border-radius:9px;background:rgba(207,227,255,.08);border-left:3px solid #cfe3ff;margin-bottom:12px;font-size:14px;line-height:1.45}
.cdet .cp em{display:block;font-style:normal;font-family:'Do Hyeon',sans-serif;font-size:16px;color:#cfe3ff}
.cbars{display:grid;grid-template-columns:auto 1fr 3.2em;gap:6px 10px;align-items:center;font-size:13px;margin-bottom:12px}
.cbars span:nth-child(3n+1){color:var(--muted)}
.cbars i{display:block;height:8px;border-radius:4px;background:rgba(241,231,207,.12);overflow:hidden}
.cbars i u{display:block;height:100%;background:var(--brass);border-radius:4px}
.cbars span:nth-child(3n){text-align:right;font-family:'Do Hyeon',sans-serif;font-size:15px}
.cmeta{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;line-height:1.5}
.cmeta>span:nth-child(odd){color:var(--muted);white-space:nowrap}
.cmeta .tg2{display:inline-block;padding:1px 8px;margin:0 4px 3px 0;border-radius:999px;border:1px solid #ff9ad0;color:#ff9ad0;font-size:12px}
@media (max-width:640px){.clsgrid{gap:5px}.clscard canvas{width:64px;height:64px}.clscard b{font-size:17px}.clscard .role{font-size:11px}}
.rank{display:flex;flex-direction:column;gap:3px}
.rrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:7px;background:rgba(0,0,0,.22);font-size:15px}
.rrow.me{background:rgba(214,169,74,.22);outline:1px solid var(--brass)}
.rrow .rn{font-family:'Do Hyeon',sans-serif;font-size:17px;text-align:center}
.rrow .rnm{min-width:0}
.rrow .rnm b{display:block;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rnm i{display:block;font-style:normal;font-size:13px;color:#e8d9b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rc{color:var(--muted);font-size:12.5px;text-align:right;line-height:1.35}
.rrow .rt{font-family:'Do Hyeon',sans-serif;color:var(--brass);font-size:18px;text-align:right}
.hof{margin:4px 0 16px;padding:14px 12px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(214,169,74,.2),rgba(0,0,0,.2));border:1px solid var(--brass)}
.hof h2{text-align:center;font-size:26px;margin:0 0 2px}
.hof .hsub{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pcard{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 8px;border-radius:10px;background:rgba(4,18,12,.55);border:1px solid rgba(214,169,74,.45);min-width:0}
.pcard.p1{order:2;padding:14px 8px;border:2px solid var(--brass);box-shadow:0 0 18px rgba(214,169,74,.35)}
.pcard.p2{order:1}.pcard.p3{order:3}
.pcard.me{outline:2px solid #9fe8b0}
.pcard .pm{font-size:30px;line-height:1}.pcard.p1 .pm{font-size:40px}
.pcard .pn{font-family:'Do Hyeon',sans-serif;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.p1 .pn{font-size:22px;color:var(--brass)}
.pcard .pc{font-size:12px;color:var(--muted)}
.pcard .ps{font-family:'Do Hyeon',sans-serif;font-size:22px;color:var(--brass)}.pcard.p1 .ps{font-size:27px}
.pcard .pq{margin-top:4px;font-size:13px;line-height:1.4;color:var(--ivory);background:rgba(241,231,207,.1);border-radius:8px;padding:6px 8px;width:100%;word-break:break-all}
.pcard .pq.empty{color:var(--muted);background:none}
.hof .rank{margin-top:10px}
.hof .more{display:block;width:100%;margin-top:8px;font-size:15px;padding:7px}
@media (max-width:520px){.podium{grid-template-columns:1fr 1fr;gap:6px}.pcard.p1{order:0;grid-column:1/-1}.pcard.p2,.pcard.p3{order:1;padding:8px 6px}.pcard .pn{font-size:17px}.pcard .ps{font-size:19px}.pcard .pq{font-size:12px}}
.mbal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:rgba(214,169,74,.14);border:1px solid var(--brass);border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-size:15px}
.mbal b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:26px;color:var(--brass)}
.mbal small{color:var(--muted);font-size:12.5px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid rgba(214,169,74,.55);background:rgba(0,0,0,.28);color:var(--ivory);font:inherit;cursor:pointer;transition:transform .1s,background .1s}
.mtile:not([disabled]):hover{background:rgba(214,169,74,.18);transform:translateY(-1px)}
.mtile[disabled]{cursor:default;opacity:.55}
.mtile.max{opacity:1;border-color:#9fe8b0;background:rgba(159,232,176,.08)}
.mtile b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:17px}
.mtile .md{font-size:12px;color:var(--muted);line-height:1.35}
.mtile .mnow{font-size:12px;color:#9fe8b0;line-height:16px;min-height:16px}

    const x=cx*G+hash(cx+3,cy-1)*G,y=cy*G+hash(cx-5,cy+2)*G;if(x<30||y<30||x>WW-30||y>WH-30)continue;const img=BART.gfImg(bi,Math.floor(hash(cx+9,cy+4)*3));pxDraw(img,x,y,img.width>>1,img.height>>1);}}

const ESPR=(()=>{
  const cache={};
  const P=(g,c,x,y,w=1,h=1)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w,h);};
  const D=(g,c,cx,cy,rx,ry)=>{ry=ry||rx;g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(cx-w,cy+y,w*2+1,1);}};
  const L=(g,c,x0,y0,x1,y1)=>{x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;g.fillStyle=c;for(let i=0;i<80;i++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}};
  function outline(c){const g=c.getContext('2d'),W=c.width,H=c.height,im=g.getImageData(0,0,W,H),d=im.data,o=new Uint8ClampedArray(d);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i+3])continue;const n=(x>0&&d[i-1])||(x<W-1&&d[i+7])||(y>0&&d[i-W*4+3])||(y<H-1&&d[i+W*4+3]);if(n){o[i]=26;o[i+1]=18;o[i+2]=14;o[i+3]=255;}}
    im.data.set(o);g.putImageData(im,0,0);}
  // 좌우 반전본까지 미리 구워 둠. 픽셀 작업용(willReadFrequently) 캔버스는 그리기 느려서 일반 캔버스로 복사해 캐시
  function get(type,f,hit,flip){const k=type+f+(hit?'h':'')+(flip?'f':'');let c=cache[k];if(c)return c;
    const sz=MDEF[type].sz,mk=o=>{const q=document.createElement('canvas');q.width=q.height=sz;return [q,q.getContext('2d',o)];};
    let g;[c,g]=mk();
    if(flip){g.translate(sz,0);g.scale(-1,1);g.drawImage(get(type,f,hit,false),0,0);}
    else if(hit){g.drawImage(get(type,f,false),0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.fillRect(0,0,sz,sz);}
    else{const [w,gw]=mk({willReadFrequently:true});MDEF[type].draw(gw,f);ART.outline(w);g.drawImage(w,0,0);}
    cache[k]=c;return c;}
  return {get,P,D,L,outline};
})();

function fusionObj(f){const A=augDef(f.a),B=augDef(f.b);return {...f,t:f.vip?'v':'f',vf:!!f.vip,tags:[...A.tags,...B.tags],parts:[f.a,f.b],lv:3,u:'',d:`${A.d} / ${B.d} / ${f.d}`,dx:f.d};}

function fusable(){return FUSIONS.filter(f=>!noFuse(f.a)&&!noFuse(f.b)&&S.augs.some(a=>a.id===f.a)&&S.augs.some(a=>a.id===f.b));}
function partnersOf(id){if(noFuse(id))return [];return FUSIONS.filter(f=>!noFuse(f.a)&&!noFuse(f.b)&&((f.a===id&&S.augs.some(a=>a.id===f.b))||(f.b===id&&S.augs.some(a=>a.id===f.a))));}
function partnerOf(id){return partnersOf(id)[0]||null;}
function doFuse(f){
  for(const a of S.augs)if((a.id===f.a||a.id===f.b)&&a.f)for(let k=a.lv;k<3;k++)applyQ(a.f,S.p,a.q);
  const pq={};for(const a of S.augs)if(a.id===f.a||a.id===f.b)pq[a.id]=a.q||1;
  S.augs=S.augs.filter(a=>a.id!==f.a&&a.id!==f.b);const o=fusionObj(f);o.pq=pq;S.augs.push(o);if(f.f)f.f(S.p);tagCount();
  const col=f.vip?'#ffd76a':'#ff4fd8';S.flash=.35;const p=S.p;S.rings.push({x:p.x,y:p.y,r:10,max:f.vip?320:200,life:.6,col});S.fused=(S.fused||0)+1;
  augFx(`${f.vip?'👑 VIP 합체!':'💥 합체!'} ${f.n}`,f.d,col,true,.5);return o;
}
function tryFuse(fromAug){
  const el=fusable();
  if(!el.length){const v=VFUSIONS.filter(f=>S.augs.some(a=>a.id===f.a)&&S.augs.some(a=>a.id===f.b));
    if(v.length&&fromAug)return doFuse(v[0]);return null;}
  // 여러 합체가 가능하면 증강 카드에서 고른 쪽(S.fuseChoice)을 우선
  const ch=S.fuseChoice&&el.find(f=>f.id===S.fuseChoice);S.fuseChoice=null;
  return doFuse(ch||el[0]);
  const sure=el.find(f=>S.augs.find(a=>a.id===f.a).lv>=3&&S.augs.find(a=>a.id===f.b).lv>=3);
  if(sure)return doFuse(sure);
  if(Math.random()<.1+LK()*.005)return doFuse(el[Math.floor(Math.random()*el.length)]);
  return null;
}

// 코드 곳곳의 p.maxHp+=X(절대 수치)는 그대로 두고, 매 프레임 차이를 기본 체력으로 옮겨 다시 곱함
const hpPct=()=>{const p=S.p;return (p.hpP||0)+(has('k_bulwark')?armorEff()/10*lv3('k_bulwark',.008,.01,.012):0)+(has('p_aegis')?tag('holy')*lv3('p_aegis',.06,.08,.1):0)+(has('b_hide')?(S.st.kills||0)/100*lv3('b_hide',.008,.01,.012):0);};
function hpSync(){const p=S.p;if(!p)return;const m=Math.max(.2,1+hpPct());if(p.hpB==null){p.hpB=p.maxHp;p.hpLM=p.maxHp;}
  if(p.maxHp!==p.hpLM)p.hpB=Math.max(1,p.hpB+(p.maxHp-p.hpLM));
  const nm=Math.max(1,Math.round(p.hpB*m));if(nm!==p.maxHp){if(nm>p.maxHp)p.hp+=nm-p.maxHp;p.maxHp=nm;}p.hp=Math.min(p.hp,p.maxHp);p.hpLM=p.maxHp;}
// 한 방 상한 (최대 체력 대비). 악몽은 10분부터 1분마다 +3% (최대 85%), 20분부터 1분마다 ×1.12로 점점 빠르게 풀림

const CHAP_MUL=[{hp:1,dm:1,sp:1,n:22,el:0,xp:1,sz:1},{hp:1,dm:1,sp:1,n:22,el:0,xp:1.2,sz:1},{hp:1.5,dm:1.3,sp:.85,n:26,el:.06,xp:1.4,sz:1},{hp:3.5,dm:1.25,sp:1.1,n:12,el:.3,xp:2.2,sz:1.2,cap:110}];

// 초기화 환불 총액: 영구 강화 + 산 외형 전부
const cosSpent=()=>COS.reduce((q,x)=>q+(cosOwn(x.k)?x.c:0),0),allSpent=()=>metaSpent()+cosSpent();
const cosOwn=k=>!!(META.cos&&META.cos.own&&META.cos.own[k]);
const cosEq=cat=>{const k=META.cos&&META.cos.eq&&META.cos.eq[cat];return k?COS.find(x=>x.k===k):null;};
const rainbowCol=(o=0)=>`hsl(${(S?S.t*120:0)+o}deg,90%,65%)`;
const mlv=k=>META.lv[k]||0;
const mcost=x=>x.c*(mlv(x.k)+1);
// 영구 강화 가격은 3배로 올림. 환불은 실제로 쓴 메달만 (META.spent). 가격 인상 전 구매분은 예전 가격(1/3)으로 계산
const metaSpent=()=>META.spent!=null?META.spent:Math.round((MSTAT.reduce((q,x)=>{const l=mlv(x.k);return q+x.c*l*(l+1)/2;},0)+MSKILL.reduce((q,x)=>q+(META.sk[x.k]?x.c:0),0))/3);
function applyMeta(){const p=S.p;p.dmgP=(p.dmgP||0)+.02*mlv('atk');p.rateP=(p.rateP||0)+.015*mlv('rate');p.maxHp+=6*mlv('hp');p.hp=p.maxHp;p.armor+=mlv('armor');p.regen+=.1*mlv('regen');p.lifesteal+=.001*mlv('ls');
  p.crit+=.005*mlv('crit');p.critM+=.04*mlv('critm');p.range*=1+.02*mlv('range');p.speed*=1+.01*mlv('spd');p.dashMul*=1-.02*mlv('dash');p.magnet*=1+.08*mlv('magnet');
  p.xpM=1+.03*mlv('xp');p.goldM+=.05*mlv('gold');S.gold+=25*mlv('sgold');p.luck+=mlv('luck');if(META.sk.token)p.token=true;if(META.sk.key)S.keys=1;if(META.sk.startCard){S.pendingLv++;S.boost=true;}}
// 보스 처치 속도 보너스: 보스마다 기준 시간보다 빨리 잡은 1초당 10점. 보스전 중엔 생존 시간이 멈추므로 실제 걸린 시간은 여기서만 반영
const BOSS_PAR=[90,90,110,140],BOSS_DM=[.55,.75,1,1];
const bossSpeedPts=()=>(S.st.btimes||[]).reduce((q,t,i)=>q+Math.round(Math.max(0,(BOSS_PAR[bossHome(i)]||120)-t)*10),0);
// 점수: 명예의 전당에 저장되는 값(생존 시간·처치·레벨·보스·난이도)만으로 계산 → 예전 기록도 같은 식으로 다시 매김
// 골드·보스 처치 속도는 빼고(골드 증강 빌드가 점수로 튀지 않게), 처치는 2000마리(4000점)부터 로그로 완만하게. 보스 4마리(클리어)면 +3000
const softC=(x,c)=>x<=c?x:c*(1+Math.log(x/c));
const scoreOf=r=>{const b=+r.bosses||0,d=DIFF[r.diff]||DIFF.normal;return Math.round(((+r.time||0)*12+softC((+r.kills||0)*2,4000)+(+r.lvl||0)*30+b*400+(b>=4?3000:0))*(d.sc||1));};
const killPts=()=>Math.round(softC(S.st.kills*2,4000));
const winPts=()=>S.win?3000:0;
const curRun=(win)=>({time:Math.floor(S.gt),kills:S.st.kills,lvl:S.lvl,bosses:win?4:(S.st.bosses||0),diff:S.diff||'normal'});
function clearScore(){return scoreOf(curRun(true));}
function runScore(){return scoreOf(curRun(false));}
// 메달: 점수 2000점당 1개 × 난이도 메달 배율(md) + 클리어 보너스(cb). 랭킹 점수와 별개로 높은 난이도 보상을 키움
const medalClear=()=>S.win?(dfM().cb||0):0;
function runMedals(sc){return Math.floor(sc/2000*(dfM().md||1))+medalClear()+(META.sk.bossMedal?(S.st.bosses||0):0);}

/* ---------- 외형 이펙트: 가격 단계(tier)가 오를수록 크고 화려하게. 게임 화면과 미리보기가 같은 함수를 씀 ---------- */
const COS_TIER={tr_star:5,tr_petal:6,tr_thunder:7,tr_void:8,tr_dragon:9,kl_heart:5,kl_soul:6,kl_firework:7,kl_lightning:8,kl_treasure:9,au_sakura:5,au_galaxy:6,au_flame:7,au_wings:8,au_dragon:9,sk_neon:5,sk_void:6,sk_lava:7,sk_crystal:8,sk_abyss:9,tr_gold:1,tr_ice:2,tr_fire:3,tr_rainbow:4,kl_coin:1,kl_card:2,kl_void:3,kl_prism:4,au_gold:1,au_jade:2,au_blood:3,au_crown:4,sk_shadow:1,sk_ice:2,sk_gold:3,sk_ghost:4};

// 모양 있는 파티클 그리기 (sh: coin/card/star/ember/shard, s: 크기)
function drawPart(c,q){const a=Math.min(1,q.life*2.2),s=q.s||4;c.globalAlpha=a;c.fillStyle=q.col;
  if(!q.sh){c.fillRect(q.x-s/2,q.y-s/2,s,s);return;}
  c.save();c.translate(q.x,q.y);c.rotate(q.rot||0);
  if(q.sh==='coin'){c.beginPath();c.ellipse(0,0,s,s*Math.abs(Math.cos((q.rot||0)*2))+1,0,0,TAU);c.fill();c.fillStyle='#fff3c4';c.fillRect(-1,-1,2,2);}
  else if(q.sh==='card'){c.fillRect(-s*.6,-s,s*1.2,s*2);c.fillStyle=q.c2||'#c8323a';c.fillRect(-1.5,-1.5,3,3);}
  else if(q.sh==='star'){c.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.35:s,an=i*Math.PI/4;c.lineTo(Math.cos(an)*r,Math.sin(an)*r);}c.closePath();c.fill();}
  else if(q.sh==='ember'){c.globalAlpha=a*.35;c.beginPath();c.arc(0,0,s*1.8,0,TAU);c.fill();c.globalAlpha=a;c.beginPath();c.arc(0,0,s*.8,0,TAU);c.fill();}
  else if(q.sh==='shard'){c.beginPath();c.moveTo(0,-s*1.4);c.lineTo(s*.7,s);c.lineTo(-s*.7,s);c.closePath();c.fill();}
  else if(q.sh==='streak'){c.fillRect(-s*1.6,-.9,s*3.2,1.8);}
  else if(q.sh==='leaf'){c.beginPath();c.ellipse(0,0,s,s*.48,0,0,TAU);c.fill();c.fillStyle='rgba(20,60,20,.7)';c.fillRect(-s*.9,-.4,s*1.8,.8);}
  else if(q.sh==='cross'){c.globalAlpha=a*.35;c.beginPath();c.arc(0,0,s*1.6,0,TAU);c.fill();c.globalAlpha=a;c.fillRect(-s*.22,-s,s*.44,s*2);c.fillRect(-s*.7,-s*.45,s*1.4,s*.44);}
  else if(q.sh==='drop'){c.beginPath();c.arc(0,0,s*.7,0,TAU);c.fill();c.beginPath();c.moveTo(-s*.6,-s*.3);c.lineTo(-s*1.9,0);c.lineTo(-s*.6,s*.3);c.fill();}
  else if(q.sh==='xmark'){const k=1-Math.min(1,q.life/.22);c.strokeStyle=q.col;c.lineCap='round';c.lineWidth=3*(1-k*.6);c.shadowColor=q.col;c.shadowBlur=10;c.beginPath();c.moveTo(-s,-s);c.lineTo(s,s);c.moveTo(s,-s);c.lineTo(-s,s);c.stroke();c.strokeStyle='#ffffff';c.lineWidth=1;c.stroke();}
  else if(q.sh==='heart'){c.beginPath();c.moveTo(0,s*.9);c.bezierCurveTo(-s*1.4,-s*.2,-s*.6,-s*1.3,0,-s*.4);c.bezierCurveTo(s*.6,-s*1.3,s*1.4,-s*.2,0,s*.9);c.fill();}
  else if(q.sh==='claw'){c.strokeStyle=q.col;c.lineCap='round';c.lineWidth=2.4;c.beginPath();for(const o of [-5,0,5]){c.moveTo(-s,o-3);c.lineTo(s,o+3);}c.stroke();}
  c.restore();}
function stepPart(q,dt){q.x+=q.vx*dt;q.y+=q.vy*dt;const d=Math.pow(q.dr??.9,dt*60);q.vx*=d;q.vy*=d;if(q.g)q.vy+=q.g*dt;if(q.vr)q.rot=(q.rot||0)+q.vr*dt;q.life-=dt;}

function trailFx(c,x,y,dx,dy,it,T,emit){const t=COS_TIER[it.k]||1,nx=-dy,ny=dx;c.lineCap='round';

// 미리보기 그림: 왼쪽 보스, 오른쪽 나. 2.2초 반복
function patDemo(g,kind,T,col){const W=240,H=140,bx=62,by=72,px=182,py=72,k=(T%2.2)/2.2,R=(x,y,r,c,a)=>{g.globalAlpha=a??1;g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.globalAlpha=1;};
  g.fillStyle='#0b2a20';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.06)';for(let x=0;x<W;x+=20){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=20){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  const tele=(x,y,r,f,c)=>{R(x,y,r,c||'#ff4040',.15);R(x,y,r*f,c||'#ff4040',.35);g.strokeStyle=c||'#ff4040';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();};
  const shot=(x,y,c)=>{R(x,y,4.5,'#14080a');R(x,y,3.2,c||col);};
  let ex=bx,ey=by,me=[px,py],eA=1;
  switch(kind){
  case 'charge':{if(k<.45){const f=k/.45;g.globalAlpha=.18;g.fillStyle='#ff4040';g.fillRect(bx,by-13,150,26);g.globalAlpha=.4;g.fillRect(bx,by-13,150*f,26);g.globalAlpha=1;}else{const f=Math.min(1,(k-.45)/.25);ex=bx+150*f;if(f>=1&&k<.85)for(let i=0;i<8;i++){const a=i/8*TAU,d=(k-.7)*200;shot(ex+Math.cos(a)*d,ey+Math.sin(a)*d);}}me=[px,py+(k>.3?Math.min(30,(k-.3)*120):0)];break;}
  case 'slam':{if(k<.5)tele(bx,by,55,k/.5);else{const d=(k-.5)*220;for(let i=0;i<12;i++){const a=i/12*TAU;shot(bx+Math.cos(a)*d,by+Math.sin(a)*d);}g.globalAlpha=Math.max(0,1-(k-.5)*4);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(bx,by,55,0,TAU);g.stroke();g.globalAlpha=1;}break;}
  case 'target':{for(let i=0;i<3;i++){const t0=i*.18,f=(k-t0)/.4;const tx=px-20+i*18,ty=py+(i-1)*14;if(f>0&&f<1)tele(tx,ty,24,f);else if(f>=1&&f<1.3)R(tx,ty,24*(1+(f-1)),'#ffffff',.6-(f-1)*2);}me=[px+Math.sin(T*3)*26,py+Math.cos(T*2)*16];break;}

const BADCARD=['러시안 룰렛','동전 던지기','도박꾼의 주사위','올인'];

// 자동 모드 보스 상점: VIP(열쇠) 구매, 증강 강화, 남은 골드로 공격·생존 스탯 구매 (부활 비용은 남김)

// 자동 이동: 이벤트 목표(제단·샘·균열·상자·도박 제단·유물·폭탄·표적 몹)가 있으면 그쪽으로 70% + 회피 30%로 섞어서 이동

    for(const b of shots){const ex=b.vx*.6,ey=b.vy*.6,L2=ex*ex+ey*ey||1,u=clamp(((tx-b.x)*ex+(ty-b.y)*ey)/L2,0,1),d=Math.hypot(b.x+ex*u-tx,b.y+ey*u-ty),R0=(b.r||5)+p.r+22;if(d<R0)sc-=(R0-d)*6;}
    // 보스전: 보스를 사거리의 50~95% 안에 두면 됨 (사거리가 길수록 움직일 여유가 커짐). 체력이 낮으면 70% 이상 거리 유지
    // 주변에 잡몹이 붙어 있으면 보스 거리보다 잡몹 회피를 우선. 보스 몸통 가까이는 언제나 크게 감점
    if(bossOn){const e=S.boss,cl=(auR||mel)&&!low,minW=e.r+p.r+(cl?(mel?20:40):90),lo=cl?minW:Math.max(minW,p.range*(low?.7:.5)),hi=mel&&!low?Math.max(minW+15,e.r+pr*.8):auR&&!low?Math.max(minW+20,auR+e.r*.8):p.range*.95,db=Math.hypot(e.x-tx,e.y-ty),k=danger>=3?.45:danger>=1?.7:1;
      sc-=k*(db<lo?(lo-db)*2.4:db>hi?(db-hi)*3:0);if(db<minW)sc-=(minW-db)*4;}
    // 보스 예고 공격·장판 회피
    for(const t of S.tele){if(!t.dmg&&t.k==='c')continue;
      if(t.k==='c'){const d=Math.hypot(t.x-tx,t.y-ty),m2=Math.hypot(t.x-(p.x+cx*STEP*.5),t.y-(p.y+cy*STEP*.5));if(d<t.r+p.r+10)sc-=900*(1-d/(t.r+p.r+10))+300;if(m2<t.r)sc-=200;}
      else{const ux=Math.cos(t.a),uy=Math.sin(t.a),px2=tx-t.x,py2=ty-t.y,u=clamp(px2*ux+py2*uy,0,t.len),dd=Math.hypot(px2-ux*u,py2-uy*u);if(dd<t.w/2+p.r+16)sc-=900;}}

    if(S.boss&&S.boss.beams&&S.boss.beams.on!==undefined){const e=S.boss,B=e.beams;for(let k=0;k<B.n;k++){const a2=B.a+B.rot*.35+k*TAU/B.n,ux=Math.cos(a2),uy=Math.sin(a2),px2=tx-e.x,py2=ty-e.y,u=clamp(px2*ux+py2*uy,0,B.len),dd=Math.hypot(px2-ux*u,py2-uy*u);if(dd<B.w/2+p.r+24)sc-=700;}}
    if(goal&&danger<2){const gd=Math.hypot(goal.x-tx,goal.y-ty);sc+=Math.max(0,300-gd)*.8;}
    if(evG&&danger<3){const gd=Math.hypot(evG.x-tx,evG.y-ty),g0=Math.hypot(evG.x-p.x,evG.y-p.y);sc+=(g0-gd)*1.6;}

  }

}

// 파일 없이 WebAudio로 만드는 칩튠. 실제 시간 기준으로 스케줄해서 게임 배속과 무관. 필드 곡 / 보스 곡 자동 전환
const BGM={on:(()=>{try{return localStorage.getItem('chanseo_bgm')!=='0';}catch(e){return true;}})(),cur:null,step:0,next:0,g:null,noise:null};
const mf=n=>440*Math.pow(2,(n-69)/12);
const TRACKS={
  field:{bpm:116,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],
    lead:[76,null,74,72,null,72,74,76, 72,null,69,null,72,74,72,null, 67,null,69,72,null,76,74,72, 74,null,71,null,67,null,null,null]},

function bgmNote(f,t,d,type,vol){const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+d+.02);}
function bgmKick(t,v){const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.16);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+.18);}
function bgmNoise(t,d,v,hp){const ac=AC,src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=BGM.noise;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);src.connect(f).connect(g).connect(BGM.g);src.start(t);src.stop(t+d+.02);}
function bgmStep(T,k,t){const st=k%32,bar=Math.floor(k/8)%4,ch=T.prog[bar],boss=T===TRACKS.boss,beat=60/T.bpm/2;
  if(boss||st%2===0)bgmNote(mf(ch[0]-12),t,beat*(boss?.9:1.8),'triangle',.22);
  bgmNote(mf(ch[k%3]+12),t,beat*.8,'square',boss?.035:.028);
  const ld=T.lead[st];if(ld)bgmNote(mf(ld),t,beat*1.6,boss?'sawtooth':'square',boss?.05:.045);
  if(k%4===0||(boss&&k%2===0))bgmKick(t,.5);
  if(boss?(k%4===2):(k%8===4))bgmNoise(t,.12,.18,1200);
  bgmNoise(t,.03,boss?.07:.05,7000);}
function bgmTick(){
  const want=BGM.on&&S&&S.started&&S.mode!=='over'&&S.mode!=='dying'&&!S.win?(S.bossI>=0?'boss':'field'):null;
  if(!want){BGM.cur=null;return;}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  if(AC.state==='suspended')AC.resume();
  if(!BGM.g){BGM.g=AC.createGain();BGM.g.gain.value=.5;BGM.g.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;BGM.noise=b;}
  if(want!==BGM.cur){BGM.cur=want;BGM.step=0;BGM.next=AC.currentTime+.08;}
  const T=TRACKS[want],beat=60/T.bpm/2;
  if(BGM.next<AC.currentTime-.2)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.15){bgmStep(T,BGM.step,BGM.next);BGM.next+=beat;BGM.step++;}
}

     let lx=ev&&ev.clientX!=null?ev.clientX+14:r.left,ly=ev&&ev.clientY!=null?ev.clientY+16:r.bottom+4;if(lx+pw>innerWidth-8)lx=innerWidth-pw-8;if(ly+ph>innerHeight-8)ly=r.top-ph-6;pop.style.left=Math.max(8,lx)+'px';pop.style.top=Math.max(8,ly)+'px';};
   stEl.querySelectorAll('.sitem[data-tip]').forEach(x=>{x.onmouseenter=e=>place(x,e);x.onmousemove=e=>place(x,e);x.onmouseleave=()=>{pop.style.display='none';};
     x.onclick=e=>{if(pop.style.display==='block'&&pop.dataset.k===x.textContent){pop.style.display='none';return;}pop.dataset.k=x.textContent;place(x,e);};});}
  $('stSave').onclick=()=>{saveGame(false);};
  // 아직 시작 전(첫 증강·카드 선택 화면)이면 저장할 게 없으니 그냥 메인으로
  $('stQuit').onclick=()=>{if(!S.started||saveGame(false)){toggleStats();newRun();startScreen();}};
  // 정산 종료: 쓰러진 것과 같게 처리(메달·명예의 전당 등록·악몽 10분 해제권). 실수 방지로 두 번 눌러야 함
  if($('stEnd'))$('stEnd').onclick=e=>{const b=e.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.innerHTML='한 번 더 누르면 정산하고 끝냅니다';return;}toggleStats();S.quitEnd=true;gameOver(false);};
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(statsOpen){}else if(S.mode==='play'||S.mode==='dying'){const n=AUTO.speed||1;for(let i=0;i<n;i++){if(S.mode!=='play'&&S.mode!=='dying')break;update(dt);}}else fx(dt);
  if(S.mode==='start')drawPreviews();
  if(S.mode==='play'){autoT+=dt;if(autoT>15){autoT=0;saveGame(true);}}
  draw();hud();requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();newRun();startScreen();requestAnimationFrame(loop);
// 피해 출처 이름 붙이기: 이 함수들로 들어간 피해는 아래 이름으로 기록 (더 구체적인 이름이 이미 있으면 그대로)
{const wd=(f,k)=>function(...a){const o=S.dsub;S.dsub=o||k;try{return f.apply(this,a);}finally{S.dsub=o;}};explode=wd(explode,'폭발');spinHit=wd(spinHit,'회전 베기');elemChain=wd(elemChain,'원소 연쇄');lightning=wd(lightning,'번개 연쇄');thunderStrike=wd(thunderStrike,'낙뢰');lvlWave=wd(lvlWave,'레벨업 충격파');}

})();
</script>
