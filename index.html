.card .tip{display:none;position:absolute;left:-4px;right:-4px;top:calc(100% + 6px);z-index:20;background:#0b1f18;color:var(--ivory);border:1px solid var(--brass);border-radius:9px;padding:10px 12px;font-size:13.5px;line-height:1.55;text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.55);pointer-events:none}

.card.peek .tip{display:block}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 10px}
.card .rr{font-size:13px;font-weight:700;color:var(--rc);filter:brightness(.75)}

button:focus-visible{outline:3px solid #fff;outline-offset:2px}

details{margin-top:14px}

function fusable(){return FUSIONS.filter(f=>S.augs.some(a=>a.id===f.a)&&S.augs.some(a=>a.id===f.b));}
function partnerOf(id){for(const f of FUSIONS){if(f.a===id&&S.augs.some(a=>a.id===f.b))return f;if(f.b===id&&S.augs.some(a=>a.id===f.a))return f;}return null;}
function doFuse(f){
  for(const a of S.augs)if((a.id===f.a||a.id===f.b)&&a.f)for(let k=a.lv;k<3;k++)applyQ(a.f,S.p,a.q);
  S.augs=S.augs.filter(a=>a.id!==f.a&&a.id!==f.b);const o=fusionObj(f);S.augs.push(o);if(f.f)f.f(S.p);tagCount();
  S.flash=.35;const p=S.p;S.rings.push({x:p.x,y:p.y,r:10,max:200,life:.5,col:'#ff4fd8'});S.fused=(S.fused||0)+1;
  augFx(`💥 합체! ${f.n}`,`${AUGS.find(x=>x.id===f.a).n} + ${AUGS.find(x=>x.id===f.b).n} · 재료 효과도 한 단계 강해짐`,'#ff4fd8',true,.5);return o;
}
function tryFuse(){
  const el=fusable();if(!el.length)return null;
  return doFuse(el[0]);
  const sure=el.find(f=>S.augs.find(a=>a.id===f.a).lv>=3&&S.augs.find(a=>a.id===f.b).lv>=3);
  if(sure)return doFuse(sure);
  if(Math.random()<.1+LK()*.005)return doFuse(el[Math.floor(Math.random()*el.length)]);
  return null;
}

function scoreAug(a){
  if(a.up)return 2+(3-a.ref.lv)+(isOff(a.ref)?2.5:0)+({s:0,g:.5,p:1}[a.ref.t]||0);
  let sc={s:1,g:2.5,p:4}[a.t]||1;
  if(a.fuseNow)sc+=20;else if(partnerOf(a.id))sc+=5;
  if(isOff(a))sc+=4;if(a.cls)sc+=3;
  const cnt={};for(const t of a.tags)cnt[t]=(cnt[t]||0)+1;
  for(const t in cnt){const c=tag(t),n=c+cnt[t];sc+=c*1.2;for(const th of [2,4,6])if(c<th&&n>=th)sc+=th;}
  if(S.p.hp<S.p.maxHp*.4&&!isOff(a))sc+=2;
  return sc+Math.random()*.8;
}
function autoAug(){
  const full=slotCount()>=MAXA,opts=full?fullOptions():augOptions(rollTier());

  gainAug(a);
}

const mf=n=>440*Math.pow(2,(n-69)/12);
const TRACKS={
  field:{bpm:116,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],
    lead:[76,null,74,72,null,72,74,76, 72,null,69,null,72,74,72,null, 67,null,69,72,null,76,74,72, 74,null,71,null,67,null,null,null]},

function bgmNote(f,t,d,type,vol){const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+d+.02);}
function bgmKick(t,v){const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.16);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+.18);}
function bgmNoise(t,d,v,hp){const ac=AC,src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=BGM.noise;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);src.connect(f).connect(g).connect(BGM.g);src.start(t);src.stop(t+d+.02);}
function bgmStep(T,k,t){const st=k%32,bar=Math.floor(k/8)%4,ch=T.prog[bar],boss=T===TRACKS.boss,beat=60/T.bpm/2;
  if(boss||st%2===0)bgmNote(mf(ch[0]-12),t,beat*(boss?.9:1.8),'triangle',.22);
  bgmNote(mf(ch[k%3]+12),t,beat*.8,'square',boss?.035:.028);
  const ld=T.lead[st];if(ld)bgmNote(mf(ld),t,beat*1.6,boss?'sawtooth':'square',boss?.05:.045);
  if(k%4===0||(boss&&k%2===0))bgmKick(t,.5);
  if(boss?(k%4===2):(k%8===4))bgmNoise(t,.12,.18,1200);
  bgmNoise(t,.03,boss?.07:.05,7000);}
function bgmTick(){
  const want=BGM.on&&S&&S.started&&S.mode!=='over'&&S.mode!=='dying'&&!S.win?(S.bossI>=0?'boss':'field'):null;
  if(!want){BGM.cur=null;return;}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  if(AC.state==='suspended')AC.resume();
  if(!BGM.g){BGM.g=AC.createGain();BGM.g.gain.value=.5;BGM.g.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;BGM.noise=b;}
  if(want!==BGM.cur){BGM.cur=want;BGM.step=0;BGM.next=AC.currentTime+.08;}
  const T=TRACKS[want],beat=60/T.bpm/2;
  if(BGM.next<AC.currentTime-.2)BGM.next=AC.currentTime+.05;
  while(BGM.next<AC.currentTime+.15){bgmStep(T,BGM.step,BGM.next);BGM.next+=beat;BGM.step++;}
}

    {const dis=S.augs.map((a,i)=>[a,i]).filter(([a])=>a.t!=='v'&&a.t!=='f'&&!a.f);
     if(dis.length)h+=`<p class="sub" style="margin-top:12px">증강 지우기 · 슬롯 1칸을 비우고 골드를 받아요. 효과와 시너지 태그도 사라져요 (스탯을 직접 올린 증강은 지울 수 없음)</p><div class="grid">${dis.map(([a,i])=>m.disc===i?`<button class="btn" data-dis="${i}" style="border-color:#ff6060;color:#ff9a9a">정말 지울까요?<small>${a.n} 지우고 +${price(40*a.lv)}골드</small></button>`:`<button class="btn" data-disc="${i}" title="${(a.d||'').replace(/"/g,'')}">🗑 ${a.n} <span class="stars">${'★'.repeat(a.lv)}</span><small>지우면 +${price(40*a.lv)}골드</small></button>`).join('')}</div>`;}
    if(fz.length)h+=`<p class="sub" style="margin-top:12px">강제 합체 · 두 증강을 하나로 (슬롯 1칸 확보)</p><div class="grid">${fz.map(f=>`<button class="btn" data-fz="${f.id}" title="${f.d}" ${g<fuseCost()?'disabled':''}>${f.n}<small>${AUGS.find(x=>x.id===f.a).n} + ${AUGS.find(x=>x.id===f.b).n} · ${Math.round(fuseCost())}골드</small></button>`).join('')}</div>`;}
  if(tab==='vip')h+=`<p class="sub">열쇠 1개로 VIP 1개. 보스를 잡을 때마다 열쇠 1개, 품목도 새로 바뀌어요.</p><div class="grid">${vs.map(v=>{const own=has(v.id),ok=augReq(v);return `<button class="btn" data-v="${v.id}" ${own||!ok||k<1?'disabled':''}>${v.n}<small>${v.d}</small><small style="color:var(--brass)">${own?'보유':!ok?'조건 미충족':'🔑 1'}</small></button>`;}).join('')}</div>`;
  if(tab==='etc'){const hc=price(55),dbl=.45+LK()*.005;
    h+=`<div class="grid">
      <button class="btn" data-doc="heal" ${g<hc||p.hp>=p.maxHp||m.used.heal?'disabled':''}>❤️ 체력 전부 회복<small>${m.used.heal?'완료':hc+'골드 · 한 번'}</small></button>
      <button class="btn" data-gb="box" ${g<boxC()?'disabled':''}>🎁 능력치 상자<small>${boxC()}골드 · 무작위 스탯 카드</small></button>
      <button class="btn" data-gb="double" style="grid-column:1/-1" ${g<1||m.used.double?'disabled':''}>🪙 더블 오어 낫싱<small>${m.used.double?'이번 상점에서 사용함':`보유 골드 전부 · 승률 ${Math.round(dbl*100)}%`}</small></button></div>`;}
  return h+`<button class="btn ghost" data-stats>내 스탯 보기</button><button class="btn primary" id="upBack">상점 나가기 · 다음 장으로</button>`;
}
function openShop(back,m){
  S.mode='shop';S.shopBack=back;
  const g=S.gold,M=MERCH[m.k],H=m.k==='hub';let body='';
  if(m.k==='chips'){
    body+=`<h3>${'오늘의 품목'} <small style="color:var(--muted);font-size:13px">지금 스탯이 높을수록 비쌈</small></h3><div class="grid">${m.stock.map(i=>{const x=STACKS[i],c=stackCost(x);return `<button class="btn" data-k="${i}" ${g<c?'disabled':''}>${withActual(x.n,x.f)}<small>${c}골드${S.buys[x.k]?`, ${S.buys[x.k]}회 구매`:''}</small></button>`;}).join('')}</div>`;
  }
  if(m.k==='smith'){
    const ups=S.augs.map((a,i)=>[a,i]).filter(([a])=>AUG_UP&&a.lv<3&&a.t!=='v'&&a.t!=='f');const maxed=S.augs.length-ups.length;
    body+=`<h3>증강 강화 <small style="color:var(--muted);font-size:13px">${maxed?`최대 강화 ${maxed}개 숨김`:''}</small></h3><div class="uplist">${ups.map(([a,i])=>{const c=Math.round(upCost(a)*.85);return `<div class="uprow"><b>${a.n} <span class="stars">${'★'.repeat(a.lv)}${'☆'.repeat(3-a.lv)}</span></b><button class="btn" data-u="${i}" ${g<c?'disabled':''}>★${a.lv+1}로 ${c}골드</button><small><span style="color:var(--ivory)">지금 효과:</span> ${a.d}<br><span style="color:var(--brass)">강화하면:</span> ${a.u||''}</small></div>`;}).join('')||'<p class="sub">강화할 증강 없음</p>'}</div>`;
  }
  if(m.k==='alch'){
    const tagStr=a=>{const c={};for(const t of a.tags)c[t]=(c[t]||0)+1;return Object.keys(c).map(t=>TAGS[t].n+(c[t]>1?' ×'+c[t]:'')).join(', ');};
    const fz=fusable();
    body+=`<h3>강제 합체 <small style="color:var(--muted);font-size:13px">슬롯 ${slotCount()}/${MAXA}</small></h3>
    <p class="sub" style="margin:0 0 8px">정해진 두 증강을 골드를 내고 바로 하나로 합쳐요. 합치면 슬롯이 한 칸 비고, 두 재료의 효과는 ★3으로 유지되면서 합체 보너스가 더해져요.</p>
    <div class="uplist">${fz.map(f=>`<div class="uprow"><b>${f.n}</b><button class="btn" data-fz="${f.id}" ${g<fuseCost()?'disabled':''}>${fuseCost()}골드</button><small><span style="color:var(--ivory)">재료:</span> ${AUGS.find(x=>x.id===f.a).n} + ${AUGS.find(x=>x.id===f.b).n}<br><span style="color:var(--brass)">합체 보너스:</span> ${f.d}</small></div>`).join('')}</div>`;
    if(!fz.length){
      const need=[];for(const f of FUSIONS){const ha=S.augs.some(x=>x.id===f.a),hb=S.augs.some(x=>x.id===f.b);if(ha!==hb){const own=AUGS.find(x=>x.id===(ha?f.a:f.b)),miss=AUGS.find(x=>x.id===(ha?f.b:f.a));if(!miss.cls||miss.cls===S.cls)need.push(`${own.n} + <b style="color:var(--ivory)">${miss.n}</b> → ${f.n}`);}}
      body+=`<p class="sub">지금 가진 증강 중에는 바로 합칠 수 있는 조합이 없어요.${need.length?' 아래 증강을 얻으면 합체할 수 있어요.':''}</p>${need.length?`<div class="syntab" style="grid-template-columns:1fr">${need.slice(0,6).map(t=>`<span>${t}</span>`).join('')}</div>`:''}`;
    }
    const dis=S.augs.map((a,i)=>[a,i]).filter(([a])=>a.t!=='v'&&a.t!=='f'&&!a.f);
    body+=`<h3>증강 분해</h3><p class="sub" style="margin:0 0 8px">증강 하나를 없애고 골드를 받아요. 슬롯이 한 칸 비어서 새 증강을 받을 수 있게 돼요. 대신 그 증강의 효과와 시너지 태그도 같이 사라져요. 능력치를 직접 올려주는 스탯형 증강은 분해할 수 없어요.</p>
    <div class="uplist">${dis.map(([a,i])=>`<div class="uprow"><b>${a.n} </b><button class="btn" data-dis="${i}">분해 +${price(40*a.lv)}골드</button><small><span style="color:var(--ivory)">효과:</span> ${a.d}<br><span style="color:var(--muted)">태그: ${tagStr(a)} (분해하면 이 태그 수가 줄어요)</span></small></div>`).join('')||'<p class="sub">분해할 수 있는 증강 없음</p>'}</div>`;
  }
  if(m.k==='doc'){
    const p=S.p,hc=price(55),mc=price(70*Math.pow(1.35,S.buys.doc||0)),tc=price(320);
    body+=`<div class="uplist">
      <div class="uprow"><b>치료</b><button class="btn" data-doc="heal" ${g<hc||p.hp>=p.maxHp||m.used.heal?'disabled':''}>${m.used.heal?'완료':hc+'골드'}</button><small>체력 전부 회복 (한 번)</small></div>
      <div class="uprow"><b>체력 단련</b><button class="btn" data-doc="max" ${g<mc?'disabled':''}>${mc}골드</button><small>최대 체력 +22, 살 때마다 가격 상승</small></div>
      <div class="uprow"><b>부활 보험</b><button class="btn" data-doc="token" ${g<tc||p.token?'disabled':''}>${p.token?'보유 중':tc+'골드'}</button><small>다음에 죽으면 골드 없이 체력 50%로 부활. 하나만 보유 가능</small></div>
    </div>`;
  }
  if(m.k==='black'){
    body+=`<p class="sub">거래는 한 번씩만. 되돌릴 수 없습니다.</p><div class="uplist">${m.deals.map(id=>{const d=DEALS.find(x=>x.id===id),c=d.cost(),done=m.used[id],ok=!d.ok||d.ok();
      return `<div class="uprow"><b>${d.n}</b><button class="btn" data-deal="${id}" ${done||!ok||c>g?'disabled':''}>${done?'완료':c>0?c+'골드':c<0?'+'+(-c)+'골드 받기':'무료'}</button><small>${d.d}</small></div>`;}).join('')}</div>`;
  }
  if(m.k==='vip'){
    const vc=vipCost(),k=S.keys||0;
    body+=`<p class="sub">보유 🔑 <b>${k}</b>. 보스를 잡을 때마다 열쇠 1개, 열쇠 1개로 VIP 1개. 품목은 보스를 잡을 때마다 새로 뽑혀요. 슬롯을 차지하지 않음.</p><div class="uplist">${vipStock().map(v=>{const own=has(v.id),ok=augReq(v);return `<div class="uprow"><b>${v.n}</b><button class="btn" data-v="${v.id}" ${own||!ok||k<vc?'disabled':''}>${own?'보유':!ok?'조건 미충족':'🔑 '+vc}</button><small>${v.d}</small></div>`;}).join('')}</div>`;
  }
  if(H)show(hubBody(m,g));
  else show(`<div class="shophead"><h2>${M.icon} ${M.n}</h2><button class="btn" id="upBackTop">${S.hub?'상점으로':'떠나기'}</button></div><p class="sub">${M.d}. 보유 <span class="gold">${g} 골드</span>. 게임은 멈춰 있습니다.</p>${body}<button class="btn primary" id="upBack">${S.hub?'상점으로 돌아가기':'떠나기'}</button>`);
  const re=()=>openShop(back,m);
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const x=STACKS[+b.dataset.k],c=stackCost(x);if(S.gold<c||stackCapped(x))return;S.gold-=c;S.buys[x.k]=(S.buys[x.k]||0)+1;x.f(S.p);S.p.luck=Math.min(LUCK_CAP,S.p.luck);re();});
  ov.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const a=S.augs[+b.dataset.u],c=Math.round(upCost(a)*.85);if(S.gold<c||a.lv>=3)return;S.gold-=c;a.lv++;if(a.f)applyQ(a.f,S.p,a.q);tagCount();toast(`${a.n} ★${a.lv}`);tryFuse();re();});
  ov.querySelectorAll('[data-fz]').forEach(b=>b.onclick=()=>{const f=FUSIONS.find(x=>x.id===b.dataset.fz),c=fuseCost();if(S.gold<c||!fusable().includes(f))return;S.gold-=c;doFuse(f);re();});
  ov.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{m.disc=+b.dataset.disc;re();});
  ov.querySelectorAll('[data-dis]').forEach(b=>b.onclick=()=>{const a=S.augs[+b.dataset.dis];if(!a)return;S.gold+=price(40*a.lv);S.augs.splice(+b.dataset.dis,1);m.disc=null;tagCount();toast(`${a.n} 지움`);re();});
  ov.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{const k=b.dataset.doc,p=S.p;
    if(k==='heal'){const c=price(55);if(S.gold<c)return;S.gold-=c;p.hp=p.maxHp;m.used.heal=1;}
    if(k==='max'){const c=price(70*Math.pow(1.35,S.buys.doc||0));if(S.gold<c)return;S.gold-=c;S.buys.doc=(S.buys.doc||0)+1;p.maxHp+=22;p.hp+=22;}
    if(k==='token'){const c=price(320);if(S.gold<c||p.token)return;S.gold-=c;p.token=true;}
    re();});
  ov.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{const d=DEALS.find(x=>x.id===b.dataset.deal),c=d.cost();if(m.used[d.id]||c>S.gold)return;S.gold-=c;m.used[d.id]=1;const r=d.f();toast(d.n+(r?': '+r:''));re();});
  ov.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=VIPS.find(x=>x.id===b.dataset.v),c=vipCost();if((S.keys||0)<c||has(v.id))return;S.keys-=c;S.augs.push({...v,lv:3});tagCount();toast('VIP '+v.n);re();});
  ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{m.tab=b.dataset.tab;m.disc=null;re();});
  ov.querySelectorAll('[data-gb]').forEach(b=>b.onclick=()=>{const k=b.dataset.gb,p=S.p;
    if(k==='box'){const c=boxC();if(S.gold<c)return;S.gold-=c;S.cbuys.box=cb('box')+1;const cd=cardOf(rollRarity(3),3);const res=cd.f(p);m.log=`능력치 상자: <span style="color:${RAR[cd.r].col};filter:brightness(1.5)">[${RAR[cd.r].n}]</span> ${cd.n} · ${res||cd.d}`;}
    if(k==='double'){if(m.used.double||S.gold<1)return;m.used.double=1;const bet=S.gold;if(Math.random()<.45+LK()*.005){S.gold+=bet;m.log=`더블 오어 낫싱: 앞면! ${bet} 골드를 따서 ${S.gold} 골드`;}else{S.gold=0;m.log=`더블 오어 낫싱: 뒷면. ${bet} 골드를 전부 잃었습니다`;}}
    re();});
  $('upBack').onclick=back;{const t=$('upBackTop');if(t)t.onclick=back;}
}

  '이동 속도':'230이 상한. 넘는 10마다 공격 속도 +3%로 바뀝니다.',
  '대시 재사용':'대시를 다시 쓸 수 있을 때까지 걸리는 시간. 대시 중에는 무적입니다.',
  '회전 칩':'내 주변을 돌며 닿는 적에게 피해를 주는 칩 개수. 공격력의 50%가 기본 피해입니다.',
  '흡수 범위':'경험치와 골드를 끌어당기는 거리.',
  '행운':'30이 상한. 0~30 구간에서 고르게 효과가 오릅니다: 스탯 카드 영웅·전설 확률(행운 0: 4.6%·0.6% → 30: 7.5%·1.7%), 스탯 카드 수치, 증강 프리즘 확률, 자동 합체 확률(10→25%), 아이템 드롭(최대 2배), 카지노 승률(45→60%)과 슬롯 결과.',
  '부활 비용':'죽었을 때 이만큼 골드가 있으면 체력 50%로 부활할 수 있습니다. 쓸 때마다 비싸집니다.',
  '골드 획득':'주운 골드에 곱해지는 배율.',
  '고유 능력':'직업마다 처음부터 가진 능력. 증강 없이도 항상 적용됩니다.',
  '레벨당 상승':'레벨이 오를 때마다 직업별로 자동으로 오르는 스탯. 스탯 카드와 별개입니다.',
  '선호 시너지':'이 태그가 붙은 증강이 선택지에 더 자주 나옵니다 (×2.5). 비선호 태그는 덜 나옵니다 (×0.3).',
  '전용 증강':'이 직업만 얻을 수 있는 증강. 일반 증강보다 잘 나옵니다. ✔는 보유 중.'
};
function renderStats(){
  const p=S.p,raw=rawRate(),rate=pRate(),ar=armorEff(),red_=ar/(ar+100),n=p.multi+(tag('card')>=6?1:0);
  const pct=v=>(v*100).toFixed(v<.1&&v>0?1:0)+'%';
  const tip=k=>STAT_TIP[k.replace(/ \d+$/,'')]||'';
  const row=(k,v,note,ct)=>{const t=ct||tip(k);return `<div class="sitem"${t?' data-tip="1"':''}><div class="srow"><span>${k}${t?'<span class="qi">ⓘ</span>':''}</span><b>${v}</b></div>${note?`<div class="snote">${note}</div>`:''}${t?`<div class="stip">${t}</div>`:''}</div>`;};
  const dps=pDmg()*rate*n*(1+critC()*(critMul()-1));
  const bonus=[];
  if(tag('house')>=2)bonus.push(`하우스 골드 보너스 +${Math.round(Math.min(.6,Math.floor(S.gold/50)*.04)*100)}%`);
  if(has('bankrupt')&&S.gold===0)bonus.push('빚쟁이 ×2');
  if(has('deathwish'))bonus.push(`죽음의 소원 +${Math.round((1-p.hp/p.maxHp)*100)}%`);
  if(raw>RATE_CAP())bonus.push(`공속 초과 ×${(1+(raw/RATE_CAP()-1)*.5).toFixed(2)}`);
  const atk=[
    row('공격력',pDmg().toFixed(1),`기본 ${p.dmg.toFixed(1)} × (1 + 보너스 합계 ${Math.round((p.dmgP||0)*100)}%)`+(bonus.length?`, ${bonus.join(', ')}`:'')),
    row('공격 속도',rate.toFixed(2)+`회/초 <small>/ ${RATE_CAP()}</small>`,raw>RATE_CAP()?`상한 초과 ${Math.round((raw/RATE_CAP()-1)*100)}% → 공격력 ×${(1+(raw/RATE_CAP()-1)*.5).toFixed(2)}`:''),
    row('치명타 확률',pct(critC())+' <small>/ 100%</small>',critRaw()>CRIT_CAP?`초과 ${Math.round((critRaw()-CRIT_CAP)*100)}% → 치명타 피해 +${Math.round((critRaw()-CRIT_CAP)*50)}%`:critFull()?'최대치. 치명타 확률 카드가 더 안 나와요':''),
    row('치명타 피해',pct(critMul())+' <small>/ 500%</small>',critMFull()?'최대치 500%. 치명타 피해 카드가 더 안 나와요':''),
    row('탄환 수',n+'발'),
    row('관통',p.pierce),
    row('사거리',Math.round(p.range)),
    row('기대 초당 피해',Math.round(dps),'탄환 기본 피해 기준. 회전 칩, 폭발, 독 제외')
  ].join('');
  const def=[
    row('최대 체력',Math.round(p.maxHp)),
    row('방어력',Math.round(ar),`받는 피해 −${pct(red_)}`+(p.dodge>DODGE_CAP?`, 회피 초과분 +${Math.round((p.dodge-DODGE_CAP)*200)} 포함`:'')+(has('iron')&&p.hp<p.maxHp*.5?', 철의 의지 ×2 적용 중':'')),
    row('회피',pct(dodgeC())+' <small>/ 60%</small>',p.dodge>DODGE_CAP?`초과 ${Math.round((p.dodge-DODGE_CAP)*100)}% → 방어력 +${Math.round((p.dodge-DODGE_CAP)*200)}`:''),
    ...(p.block?[row('막기',pct(p.block+(has('k_wall')?lv3('k_wall',.15,.2,.25):0)),'막으면 피해 무효')]:[]),
    row('보호막',Math.round(barrierMax())),
    row('체력 재생',p.regen.toFixed(1)+'/초'),
    row('흡혈',pct(p.lifesteal)),
    row('받는 피해 배율','×'+p.vuln.toFixed(2))
  ].join('');
  const util=[
    row('이동 속도',Math.round(Math.min(SPEED_CAP,moveSpd()))+' <small>/ 230</small>',moveSpd()>SPEED_CAP?`상한 230 초과 ${Math.round(moveSpd()-SPEED_CAP)} → 공격 속도 +${Math.round((moveSpd()-SPEED_CAP)/10*3)}%`:''),
    row('대시 재사용',dashCdVal().toFixed(2)+'초'),
    row('회전 칩',orbitN()+'개'),
    row('흡수 범위',Math.round(p.magnet)),
    row('행운',(+Math.min(p.luck,LUCK_CAP).toFixed(1))+' <small>/ 30</small>',p.luck>LUCK_CAP?`초과 ${(p.luck-LUCK_CAP).toFixed(1)}은 효과 없음`:''),
    row('부활 비용',reviveCost()+'골드'),
    row('골드 획득','×'+(p.goldM*(has('bankrupt')?.7:1)).toFixed(2))
  ].join('');
  const syn=Object.keys(TAGS).filter(t=>tag(t)>0).map(t=>{const c=tag(t),T=TAGS[t],on=[1,2,4,6].filter(k=>c>=k&&T['t'+k]).map(k=>T['t'+k]);if(c>=5)on.push(`초과 ${c-4}개: ${T.ex} ×${c-4}`);const L=(n,x)=>`<div style="color:${c>=n?'var(--brass)':'var(--muted)'}">${c>=n?'✔':'·'} ${n}개: ${x}</div>`;
    return row(`${T.n} ${c}`,on.length?(c>=5?'초과 +'+(c-4):on.length+'단계'):'-','',`${T.t1?L(1,T.t1):''}${L(2,T.t2)}${L(4,T.t4)}${L(6,T.t6)}<div style="color:${c>=5?'var(--brass)':'var(--muted)'}">${c>=5?'✔':'·'} 5개부터 1개마다: ${T.ex}</div>`);}).join('')||'<p class="sub">아직 없음</p>';
  stEl.innerHTML=`<div class="panel"><div class="shophead"><h2>내 스탯</h2><button class="btn" id="stCloseTop" aria-label="닫기" style="min-width:48px;font-size:20px">✕</button></div><p class="sub">${CLASSES[S.cls].n}. ${CLASSES[S.cls].passive}. ${Math.floor(S.gt/60)}분 ${Math.floor(S.gt%60)}초, 레벨 ${S.lvl}. 열려 있는 동안 게임이 멈춥니다.</p>
  <h3>직업: ${CLASSES[S.cls].n} <small style="color:var(--muted);font-size:13px">${CLASSES[S.cls].role}</small></h3>
  ${row('고유 능력',' ',CLASSES[S.cls].passive)}${row('레벨당 상승',`${S.lvl-1}회 누적`,CLASSES[S.cls].lvd)}
  <div class="sgrid"><div class="sgrp"><h3>공격</h3>${atk}</div><div class="sgrp"><h3>방어</h3>${def}<h3>유틸</h3>${util}</div></div>
  <h3>시너지</h3>${syn}
  <h3 title="일반 증강은 최대 ${MAXA}개. VIP 증강은 슬롯을 차지하지 않습니다. 슬롯이 가득 차면 합체 짝이 되는 증강만 나옵니다">증강 슬롯 ${slotCount()}/${MAXA}${S.augs.length>slotCount()?` (+VIP ${S.augs.length-slotCount()})`:''}</h3>${S.augs.map(a=>row(a.n,(a.t==='v'?'VIP':a.t==='f'?'합체':''),'',`<b style="color:${(TIER[a.t]||{}).col||'var(--brass)'};filter:brightness(1.4)">${(TIER[a.t]||{n:''}).n}</b> · ${a.tags.map(t=>TAGS[t].n).join(', ')}<br>${a.d}${a.u&&a.t!=='v'&&a.t!=='f'?`<br><span style="color:var(--muted)">강화하면: ${a.u}</span>`:''}`)).join('')||'<p class="sub">없음</p>'}
  <div class="btnrow"><button class="btn" id="stSave">저장</button><button class="btn" id="stQuit">저장하고 메인으로</button></div>
  <button class="btn primary" id="stClose">닫기</button></div>`;
  $('stClose').onclick=toggleStats;$('stCloseTop').onclick=toggleStats;
  {let pop=document.getElementById('stipPop');if(!pop){pop=document.createElement('div');pop.id='stipPop';document.body.appendChild(pop);}
   const place=(x,ev)=>{pop.innerHTML=x.querySelector('.stip').innerHTML;pop.style.display='block';const r=x.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
     let lx=ev&&ev.clientX!=null?ev.clientX+14:r.left,ly=ev&&ev.clientY!=null?ev.clientY+16:r.bottom+4;if(lx+pw>innerWidth-8)lx=innerWidth-pw-8;if(ly+ph>innerHeight-8)ly=r.top-ph-6;pop.style.left=Math.max(8,lx)+'px';pop.style.top=Math.max(8,ly)+'px';};
   stEl.querySelectorAll('.sitem[data-tip]').forEach(x=>{x.onmouseenter=e=>place(x,e);x.onmousemove=e=>place(x,e);x.onmouseleave=()=>{pop.style.display='none';};
     x.onclick=e=>{if(pop.style.display==='block'&&pop.dataset.k===x.textContent){pop.style.display='none';return;}pop.dataset.k=x.textContent;place(x,e);};});}
  $('stSave').onclick=()=>{saveGame(false);};
  $('stQuit').onclick=()=>{if(saveGame(false)){toggleStats();newRun();startScreen();}};
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(statsOpen){}else if(S.mode==='play'||S.mode==='dying'){const n=AUTO.speed||1;for(let i=0;i<n;i++){if(S.mode!=='play'&&S.mode!=='dying')break;update(dt);}}else fx(dt);
  if(S.mode==='start')drawPreviews();
  if(S.mode==='play'){autoT+=dt;if(autoT>15){autoT=0;saveGame(true);}}
  draw();hud();requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();newRun();startScreen();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
